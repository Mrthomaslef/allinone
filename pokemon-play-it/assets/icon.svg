<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" fill="none">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="128" y2="128" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1E3A8A"/>
      <stop offset="50%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#7F1D1D"/>
    </linearGradient>
    <linearGradient id="gold" x1="20" y1="16" x2="108" y2="112" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FDE047"/>
      <stop offset="100%" stop-color="#F59E0B"/>
    </linearGradient>
  </defs>
  <rect width="128" height="128" rx="28" fill="url(#bg)"/>
  <rect x="4" y="4" width="120" height="120" rx="24" stroke="url(#gold)" stroke-width="3" stroke-opacity="0.7"/>
  <!-- Left Card (Water) -->
  <g transform="rotate(-12 52 66)">
    <rect x="26" y="26" width="52" height="74" rx="7" fill="#0284C7" stroke="#F8FAFC" stroke-width="3"/>
    <rect x="32" y="34" width="40" height="28" rx="3" fill="#38BDF8"/>
    <circle cx="52" cy="48" r="9" fill="#E0F2FE"/>
  </g>
  <!-- Right Card (Fire/Fighting) -->
  <g transform="rotate(10 76 64)">
    <rect x="50" y="24" width="52" height="74" rx="7" fill="#DC2626" stroke="#FDE047" stroke-width="3.5"/>
    <rect x="56" y="32" width="40" height="28" rx="3" fill="#FCA5A5"/>
    <!-- Pokéball emblem -->
    <circle cx="76" cy="68" r="16" fill="#FFFFFF" stroke="#1E293B" stroke-width="3.5"/>
    <path d="M60 68 A16 16 0 0 1 92 68 Z" fill="#EF4444" stroke="#1E293B" stroke-width="3.5"/>
    <circle cx="76" cy="68" r="5" fill="#FFFFFF" stroke="#1E293B" stroke-width="3"/>
  </g>
  <!-- 1999 Star Sparkles -->
  <circle cx="24" cy="28" r="3" fill="#FDE047"/>
  <circle cx="104" cy="30" r="3.5" fill="#FDE047"/>
  <circle cx="100" cy="100" r="2.5" fill="#38BDF8"/>
</svg>
