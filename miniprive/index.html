<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>MiniPrivé — Connexion au Mac Mini</title>
  <link rel="icon" type="image/svg+xml" href="assets/icon.svg" />
  <link rel="apple-touch-icon" href="../apple-touch-icon.png" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="theme-color" content="#09090b" />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #09090b;
      color: #fafafa;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", Inter, sans-serif;
      height: 100dvh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
      text-align: center;
    }
    .card {
      max-width: 340px;
      width: 100%;
      background: #121215;
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 18px;
      padding: 28px 22px;
    }
    .dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: #10b981;
      margin: 0 auto 16px;
      box-shadow: 0 0 12px #10b981;
      animation: pulse 1.4s infinite ease-in-out;
    }
    @keyframes pulse { 0%, 100% { opacity: 0.4; } 50% { opacity: 1; } }
    h1 { font-size: 16px; font-weight: 600; margin-bottom: 8px; letter-spacing: -0.01em; }
    p { font-size: 12px; color: #a1a1aa; line-height: 1.5; margin-bottom: 18px; }
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      height: 40px;
      border-radius: 10px;
      background: #fafafa;
      color: #09090b;
      font-size: 13px;
      font-weight: 600;
      text-decoration: none;
      margin-top: 6px;
    }
    .btn-sec {
      background: #1c1c21;
      color: #a1a1aa;
      border: 1px solid rgba(255,255,255,0.08);
      margin-top: 8px;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="dot" id="dot"></div>
    <h1 id="title">Connexion à MiniPrivé…</h1>
    <p id="desc">Redirection automatique vers le tunnel HTTPS actif de ton Mac mini (PIN : 2580).</p>
    <a id="btnTunnel" class="btn" href="#" style="display:none;">Ouvrir le Tunnel Mondial HTTPS</a>
    <a id="btnLan" class="btn btn-sec" href="http://192.168.1.152:3456">Ouvrir en Wi-Fi Local (Maison)</a>
  </div>
  <script>
    async function connect() {
      try {
        const res = await fetch('./endpoint.json?t=' + Date.now(), { cache: 'no-store' });
        const data = await res.json();
        if (data.lanUrl) {
          document.getElementById('btnLan').href = data.lanUrl;
        }
        if (data.tunnelUrl) {
          const btn = document.getElementById('btnTunnel');
          btn.href = data.tunnelUrl;
          btn.style.display = 'inline-flex';
          window.location.replace(data.tunnelUrl);
        }
      } catch (e) {
        document.getElementById('title').textContent = 'Connexion manuelle';
      }
    }
    connect();
  </script>
</body>
</html>
