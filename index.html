<!DOCTYPE html>
<html lang="fr" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>All-In-One • @Mrthomaslef</title>
  <meta name="description" content="Tous les projets en production et sur GitHub de Thomas Lefèvre (@Mrthomaslef), rangés par catégories." />
  <meta name="theme-color" content="#090D16" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="All-In-One" />
  <link rel="manifest" href="manifest.json" />
  <link rel="icon" type="image/svg+xml" href="assets/icon.svg" />
  <link rel="apple-touch-icon" href="assets/logo.jpg" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />

  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    :root {
      --safe-top: env(safe-area-inset-top, 0px);
      --safe-bottom: env(safe-area-inset-bottom, 0px);
    }

    * {
      -webkit-tap-highlight-color: transparent;
      box-sizing: border-box;
    }

    body {
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
      background-color: #090D16;
      color: #F8FAFC;
      min-height: 100dvh;
      margin: 0;
    }

    .no-scrollbar::-webkit-scrollbar {
      display: none;
    }
    .no-scrollbar {
      -ms-overflow-style: none;
      scrollbar-width: none;
    }

    .app-card {
      background: rgba(255, 255, 255, 0.035);
      border: 1px solid rgba(255, 255, 255, 0.07);
      transition: transform 0.15s ease, background-color 0.15s ease, border-color 0.15s ease;
    }

    .app-card:active {
      transform: scale(0.985);
      background: rgba(255, 255, 255, 0.06);
    }

    @media (hover: hover) {
      .app-card:hover {
        background: rgba(255, 255, 255, 0.055);
        border-color: rgba(255, 255, 255, 0.14);
      }
    }
  </style>
</head>
<body class="antialiased selection:bg-cyan-500/30">

  <div class="max-w-lg mx-auto min-h-dvh flex flex-col px-4" style="padding-top: max(1rem, var(--safe-top)); padding-bottom: max(2rem, var(--safe-bottom));">

    <!-- HEADER SIMPLE & ÉPURÉ -->
    <header class="pt-2 pb-4">
      <div class="flex items-center justify-between">
        <div class="flex items-center gap-3.5">
          <img
            src="assets/logo.jpg"
            onerror="this.src='assets/icon.svg'"
            alt="Logo All-In-One"
            class="w-12 h-12 rounded-2xl object-cover shadow-lg shadow-cyan-500/10 border border-white/15"
          />
          <div>
            <h1 class="text-xl font-extrabold tracking-tight text-white">All-In-One</h1>
            <p class="text-xs text-slate-400">Projets en production • @Mrthomaslef</p>
          </div>
        </div>

        <a
          href="https://github.com/Mrthomaslef?tab=repositories"
          target="_blank"
          rel="noopener"
          class="inline-flex items-center gap-1.5 px-3 py-2 rounded-xl bg-white/5 hover:bg-white/10 border border-white/10 text-xs font-semibold text-slate-200 transition"
        >
          <svg class="w-4 h-4" fill="currentColor" viewBox="0 0 24 24">
            <path fill-rule="evenodd" clip-rule="evenodd" d="M12 2C6.477 2 2 6.484 2 12.017c0 4.425 2.865 8.18 6.839 9.504.5.092.682-.217.682-.483 0-.237-.008-.868-.013-1.703-2.782.605-3.369-1.343-3.369-1.343-.454-1.158-1.11-1.466-1.11-1.466-.908-.62.069-.608.069-.608 1.003.07 1.53 1.032 1.53 1.032.892 1.53 2.341 1.088 2.91.832.092-.647.35-1.088.636-1.338-2.22-.253-4.555-1.113-4.555-4.951 0-1.093.39-1.988 1.029-2.688-.103-.253-.446-1.272.098-2.65 0 0 .84-.27 2.75 1.026A9.564 9.564 0 0112 6.844c.85.004 1.705.115 2.504.337 1.909-1.296 2.747-1.027 2.747-1.027.546 1.379.202 2.398.1 2.651.64.7 1.028 1.595 1.028 2.688 0 3.848-2.339 4.695-4.566 4.943.359.309.678.92.678 1.855 0 1.338-.012 2.419-.012 2.747 0 .268.18.58.688.482A10.019 10.019 0 0022 12.017C22 6.484 17.522 2 12 2z"/>
          </svg>
          <span>GitHub</span>
        </a>
      </div>

      <!-- RECHERCHE SIMPLE -->
      <div class="mt-4 relative">
        <svg class="w-4 h-4 text-slate-500 absolute left-3.5 top-1/2 -translate-y-1/2 pointer-events-none" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
          <path stroke-linecap="round" stroke-linejoin="round" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" />
        </svg>
        <input
          id="search-input"
          type="search"
          placeholder="Rechercher une application..."
          oninput="handleSearch(this.value)"
          class="w-full pl-10 pr-4 py-2.5 rounded-2xl bg-white/[0.04] border border-white/10 focus:border-cyan-400/50 focus:outline-none text-sm text-white placeholder-slate-500 transition"
        />
      </div>

      <!-- FILTRES PAR CATÉGORIES -->
      <div id="category-tabs" class="flex items-center gap-2 overflow-x-auto no-scrollbar mt-3 pt-0.5"></div>
    </header>

    <!-- LISTE DES PROJETS PAR CATÉGORIES -->
    <main id="projects-container" class="flex-1 space-y-6 pt-1"></main>

  </div>

  <script>
    const GITHUB_USERNAME = 'Mrthomaslef';

    const CATEGORIES = [
      { id: 'medical-imaging', name: 'Imagerie & Radiologie', emoji: '🩻', color: 'text-cyan-400' },
      { id: 'clinical-calc',   name: 'Calculateurs Médicaux', emoji: '🧮', color: 'text-emerald-400' },
      { id: 'daily-tools',     name: 'Quotidien & Pratique',  emoji: '📦', color: 'text-amber-400' },
      { id: 'games-family',    name: 'Jeux & Famille',        emoji: '🎮', color: 'text-violet-400' }
    ];

    const PROJECTS = [
      // Imagerie & Radiologie
      {
        id: 'biblioosteo',
        title: 'BiblioOstéo Cochin',
        subtitle: 'Portail bibliographique & résumés cliniques (RI & Ostéo)',
        category: 'medical-imaging',
        emoji: '🦴',
        prodUrl: 'https://mrthomaslef.github.io/biblioosteo/',
        githubUrl: 'https://github.com/Mrthomaslef/biblioosteo'
      },
      {
        id: 'agenda-cochin',
        title: 'Cochin RI — Agenda',
        subtitle: 'Planning de Radiologie Interventionnelle (Cochin Radio B)',
        category: 'medical-imaging',
        emoji: '📅',
        prodUrl: 'https://mrthomaslef.github.io/agenda-cochin/',
        githubUrl: 'https://github.com/Mrthomaslef/agenda-cochin'
      },
      {
        id: 'radio-thomas',
        title: 'QUIZ Cochin',
        subtitle: 'Quiz d’imagerie musculosquelettique',
        category: 'medical-imaging',
        emoji: '🧠',
        prodUrl: 'https://radio-thomas-ten.vercel.app',
        githubUrl: 'https://github.com/Mrthomaslef/radio-thomas'
      },
      {
        id: 'dicomviewer',
        title: 'TPack PACS',
        subtitle: 'Visionneuse DICOM & imagerie médicale pédagogique',
        category: 'medical-imaging',
        emoji: '🖥️',
        prodUrl: 'https://mrthomaslef.github.io/dicomviewer/',
        githubUrl: 'https://github.com/Mrthomaslef/dicomviewer'
      },
      {
        id: 'tpack-cases',
        title: 'TPack Cases',
        subtitle: 'Banque de cas cliniques d’imagerie (.tpack)',
        category: 'medical-imaging',
        emoji: '🗂️',
        prodUrl: 'https://mrthomaslef.github.io/tpack-cases/',
        githubUrl: 'https://github.com/Mrthomaslef/tpack-cases'
      },

      // Calculateurs Médicaux
      {
        id: 'Tomatocalc',
        title: 'TomatoCalc.',
        subtitle: 'Calculateurs médicaux, scores cliniques & classifications',
        category: 'clinical-calc',
        emoji: '🍅',
        prodUrl: 'https://mrthomaslef.github.io/Tomatocalc/',
        githubUrl: 'https://github.com/Mrthomaslef/Tomatocalc'
      },
      {
        id: 'Medicalc',
        title: 'MediCalc',
        subtitle: 'Calculateurs médicaux rapides & aide clinique',
        category: 'clinical-calc',
        emoji: '⚕️',
        prodUrl: 'https://mrthomaslef.github.io/Medicalc/',
        githubUrl: 'https://github.com/Mrthomaslef/Medicalc'
      },

      // Quotidien & Pratique
      {
        id: 'colistrack',
        title: 'ColisTrack',
        subtitle: 'Suivi de livraisons & colis (PWA privée)',
        category: 'daily-tools',
        emoji: '📦',
        prodUrl: 'https://mrthomaslef.github.io/colistrack/',
        githubUrl: 'https://github.com/Mrthomaslef/colistrack'
      },
      {
        id: 'assistante-maternelle',
        title: 'AssMat — Paie & Pajemploi',
        subtitle: 'Calculateur de salaire, présence & fiche de paie',
        category: 'daily-tools',
        emoji: '👶',
        prodUrl: 'https://mrthomaslef.github.io/assistante-maternelle/',
        githubUrl: 'https://github.com/Mrthomaslef/assistante-maternelle'
      },

      // Jeux & Famille
      {
        id: 'quiz-trentenaires',
        title: 'QUIZ du 7TER',
        subtitle: 'Grand Quiz Show multijoueur (2 couples / 4 joueurs)',
        category: 'games-family',
        emoji: '🎉',
        prodUrl: 'https://mrthomaslef.github.io/quiz-trentenaires/',
        githubUrl: 'https://github.com/Mrthomaslef/quiz-trentenaires'
      },
      {
        id: 'pocket-tcg-family',
        title: 'milTCG — Pocket Family',
        subtitle: 'Ouverture de boosters & collection de cartes en famille',
        category: 'games-family',
        emoji: '🃏',
        prodUrl: 'https://mrthomaslef.github.io/pocket-tcg-family/',
        githubUrl: 'https://github.com/Mrthomaslef/pocket-tcg-family'
      },
      {
        id: 'Holidamn',
        title: 'Holidamn',
        subtitle: 'Portail vidéo & souvenirs de vacances',
        category: 'games-family',
        emoji: '🌴',
        prodUrl: 'https://mrthomaslef.github.io/Holidamn/',
        githubUrl: 'https://github.com/Mrthomaslef/Holidamn'
      }
    ];

    let activeCategory = 'all';
    let searchQuery = '';

    function renderTabs() {
      const tabsEl = document.getElementById('category-tabs');
      const allBtn = `
        <button onclick="setCategory('all')" class="shrink-0 px-3.5 py-1.5 rounded-full text-xs font-semibold transition ${
          activeCategory === 'all'
            ? 'bg-white text-slate-950'
            : 'bg-white/5 text-slate-400 hover:text-white'
        }">
          Tout (${PROJECTS.length})
        </button>
      `;

      const catBtns = CATEGORIES.map(cat => {
        const count = PROJECTS.filter(p => p.category === cat.id).length;
        const active = activeCategory === cat.id;
        return `
          <button onclick="setCategory('${cat.id}')" class="shrink-0 inline-flex items-center gap-1.5 px-3.5 py-1.5 rounded-full text-xs font-semibold transition ${
            active
              ? 'bg-white text-slate-950'
              : 'bg-white/5 text-slate-400 hover:text-white'
          }">
            <span>${cat.emoji}</span>
            <span>${cat.name}</span>
            <span class="opacity-60">${count}</span>
          </button>
        `;
      }).join('');

      tabsEl.innerHTML = allBtn + catBtns;
    }

    function renderProjects() {
      const container = document.getElementById('projects-container');
      const q = searchQuery.trim().toLowerCase();

      const visibleCategories = activeCategory === 'all'
        ? CATEGORIES
        : CATEGORIES.filter(c => c.id === activeCategory);

      let html = '';

      visibleCategories.forEach(cat => {
        const items = PROJECTS.filter(p => {
          if (p.category !== cat.id) return false;
          if (!q) return true;
          return `${p.title} ${p.subtitle} ${p.id}`.toLowerCase().includes(q);
        });

        if (items.length === 0) return;

        html += `
          <section class="space-y-2.5">
            <div class="flex items-center justify-between px-1">
              <h2 class="text-xs font-bold uppercase tracking-wider text-slate-400 flex items-center gap-2">
                <span>${cat.emoji}</span>
                <span>${cat.name}</span>
              </h2>
              <span class="text-xs text-slate-600 font-medium">${items.length}</span>
            </div>

            <div class="space-y-2">
              ${items.map(p => `
                <div class="app-card rounded-2xl p-3 flex items-center justify-between gap-3">
                  <!-- Lien principal vers la Prod -->
                  <a href="${p.prodUrl}" target="_blank" rel="noopener" class="flex items-center gap-3.5 min-w-0 flex-1">
                    <div class="w-11 h-11 rounded-xl bg-white/[0.06] border border-white/10 flex items-center justify-center text-xl shrink-0">
                      ${p.emoji}
                    </div>
                    <div class="min-w-0 flex-1">
                      <div class="text-sm font-bold text-white truncate">${p.title}</div>
                      <div class="text-xs text-slate-400 truncate mt-0.5">${p.subtitle}</div>
                    </div>
                  </a>

                  <!-- Boutons directs : GitHub + Ouvrir Prod -->
                  <div class="flex items-center gap-1.5 shrink-0">
                    <a
                      href="${p.githubUrl}"
                      target="_blank"
                      rel="noopener"
                      title="Code source GitHub"
                      class="p-2.5 rounded-xl bg-white/5 hover:bg-white/10 text-slate-400 hover:text-white transition"
                    >
                      <svg class="w-4 h-4" fill="currentColor" viewBox="0 0 24 24">
                        <path fill-rule="evenodd" clip-rule="evenodd" d="M12 2C6.477 2 2 6.484 2 12.017c0 4.425 2.865 8.18 6.839 9.504.5.092.682-.217.682-.483 0-.237-.008-.868-.013-1.703-2.782.605-3.369-1.343-3.369-1.343-.454-1.158-1.11-1.466-1.11-1.466-.908-.62.069-.608.069-.608 1.003.07 1.53 1.032 1.53 1.032.892 1.53 2.341 1.088 2.91.832.092-.647.35-1.088.636-1.338-2.22-.253-4.555-1.113-4.555-4.951 0-1.093.39-1.988 1.029-2.688-.103-.253-.446-1.272.098-2.65 0 0 .84-.27 2.75 1.026A9.564 9.564 0 0112 6.844c.85.004 1.705.115 2.504.337 1.909-1.296 2.747-1.027 2.747-1.027.546 1.379.202 2.398.1 2.651.64.7 1.028 1.595 1.028 2.688 0 3.848-2.339 4.695-4.566 4.943.359.309.678.92.678 1.855 0 1.338-.012 2.419-.012 2.747 0 .268.18.58.688.482A10.019 10.019 0 0022 12.017C22 6.484 17.522 2 12 2z"/>
                      </svg>
                    </a>

                    <a
                      href="${p.prodUrl}"
                      target="_blank"
                      rel="noopener"
                      class="px-3 py-2 rounded-xl bg-cyan-500/15 hover:bg-cyan-500/25 text-cyan-300 font-semibold text-xs flex items-center gap-1 transition"
                    >
                      <span>Ouvrir</span>
                      <svg class="w-3.5 h-3.5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.2">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M7 17L17 7M17 7H8M17 7V16" />
                      </svg>
                    </a>
                  </div>
                </div>
              `).join('')}
            </div>
          </section>
        `;
      });

      if (!html) {
        html = `
          <div class="text-center py-12 text-sm text-slate-500">
            Aucun projet trouvé pour « ${searchQuery} ».
          </div>
        `;
      }

      container.innerHTML = html;
    }

    function setCategory(catId) {
      activeCategory = catId;
      renderTabs();
      renderProjects();
    }

    function handleSearch(val) {
      searchQuery = val;
      renderProjects();
    }

    // Auto-détection discrète de nouveaux dépôts publiés sur GitHub
    async function syncNewGitHubRepos() {
      try {
        const res = await fetch(`https://api.github.com/users/${GITHUB_USERNAME}/repos?per_page=100&sort=updated`);
        if (!res.ok) return;
        const repos = await res.json();
        let changed = false;

        repos.forEach(r => {
          if (r.name.toLowerCase() === 'allinone') return;
          const exists = PROJECTS.some(p => p.id.toLowerCase() === r.name.toLowerCase());
          if (!exists && (r.has_pages || (r.homepage && r.homepage.startsWith('http')))) {
            PROJECTS.push({
              id: r.name,
              title: r.name,
              subtitle: r.description || 'Application publiée sur GitHub',
              category: 'daily-tools',
              emoji: '🚀',
              prodUrl: (r.homepage && r.homepage.startsWith('http')) ? r.homepage : `https://${GITHUB_USERNAME.toLowerCase()}.github.io/${r.name}/`,
              githubUrl: r.html_url
            });
            changed = true;
          }
        });

        if (changed) {
          renderTabs();
          renderProjects();
        }
      } catch (_) {}
    }

    renderTabs();
    renderProjects();
    syncNewGitHubRepos();
  </script>
</body>
</html>
