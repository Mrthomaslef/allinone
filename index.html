<!DOCTYPE html>
<html lang="fr" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>All-In-One • @Mrthomaslef</title>
  <meta name="description" content="Tous les projets en production et sur GitHub de Thomas Lefèvre (@Mrthomaslef), rangés par catégories et synchronisés automatiquement." />
  <meta name="theme-color" content="#090D16" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="All-In-One" />
  <link rel="manifest" href="manifest.json" />
  <link rel="icon" type="image/svg+xml" href="assets/icon.svg" />
  <link rel="apple-touch-icon" href="assets/logo.jpg" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />

  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    :root {
      --safe-top: env(safe-area-inset-top, 0px);
      --safe-bottom: env(safe-area-inset-bottom, 0px);
    }

    * {
      -webkit-tap-highlight-color: transparent;
      box-sizing: border-box;
    }

    html, body {
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
      background-color: #090D16;
      color: #F8FAFC;
      min-height: 100dvh;
      margin: 0;
      overscroll-behavior-y: contain;
    }

    .no-scrollbar::-webkit-scrollbar {
      display: none;
    }
    .no-scrollbar {
      -ms-overflow-style: none;
      scrollbar-width: none;
    }

    .app-card {
      background: rgba(255, 255, 255, 0.035);
      border: 1px solid rgba(255, 255, 255, 0.07);
      transition: transform 0.15s ease, background-color 0.15s ease, border-color 0.15s ease;
    }

    .app-card:active {
      transform: scale(0.985);
      background: rgba(255, 255, 255, 0.06);
    }

    @media (hover: hover) {
      .app-card:hover {
        background: rgba(255, 255, 255, 0.055);
        border-color: rgba(255, 255, 255, 0.14);
      }
    }

    /* Pull-to-Refresh Indicator */
    #ptr-container {
      height: 0px;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: height 0.25s cubic-bezier(0.22, 1, 0.36, 1), opacity 0.2s ease;
      opacity: 0;
      user-select: none;
    }
    #ptr-container.dragging {
      transition: none;
    }
  </style>
</head>
<body class="antialiased selection:bg-cyan-500/30">

  <!-- PULL-TO-REFRESH INDICATOR (Glisser vers le bas pour actualiser) -->
  <div id="ptr-container" style="margin-top: var(--safe-top);">
    <div class="inline-flex items-center gap-2 px-3.5 py-1.5 rounded-full bg-white/[0.06] border border-white/10 text-xs font-semibold text-slate-300 shadow-lg">
      <svg id="ptr-spinner" class="w-4 h-4 text-cyan-400 transition-transform duration-150" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.2">
        <path stroke-linecap="round" stroke-linejoin="round" d="M19 14l-7 7m0 0l-7-7m7 7V3" />
      </svg>
      <span id="ptr-label">Tirer pour actualiser</span>
    </div>
  </div>

  <div id="app-content" class="max-w-lg mx-auto min-h-dvh flex flex-col px-4" style="padding-top: max(0.75rem, var(--safe-top)); padding-bottom: max(2rem, var(--safe-bottom));">

    <!-- HEADER SIMPLE & ÉPURÉ -->
    <header class="pt-2 pb-4">
      <div class="flex items-center justify-between">
        <div class="flex items-center gap-3.5">
          <img
            src="assets/logo.jpg"
            onerror="this.src='assets/icon.svg'"
            alt="Logo All-In-One"
            class="w-12 h-12 rounded-2xl object-cover shadow-lg shadow-cyan-500/10 border border-white/15"
          />
          <div>
            <div class="flex items-center gap-2">
              <h1 class="text-xl font-extrabold tracking-tight text-white">All-In-One</h1>
              <span id="live-dot" class="w-2 h-2 rounded-full bg-emerald-400" title="Synchronisation automatique GitHub active"></span>
            </div>
            <p id="sync-subtitle" class="text-xs text-slate-400">Tirer vers le bas pour actualiser</p>
          </div>
        </div>

        <div class="flex items-center gap-1.5">
          <button
            onclick="syncFromGitHub(true)"
            title="Actualiser les projets depuis GitHub"
            class="p-2 rounded-xl bg-white/5 hover:bg-white/10 border border-white/10 text-slate-300 transition active:scale-95"
          >
            <svg id="refresh-icon" class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
              <path stroke-linecap="round" stroke-linejoin="round" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15" />
            </svg>
          </button>

          <a
            href="https://github.com/Mrthomaslef?tab=repositories"
            target="_blank"
            rel="noopener"
            class="inline-flex items-center gap-1.5 px-3 py-2 rounded-xl bg-white/5 hover:bg-white/10 border border-white/10 text-xs font-semibold text-slate-200 transition"
          >
            <svg class="w-4 h-4" fill="currentColor" viewBox="0 0 24 24">
              <path fill-rule="evenodd" clip-rule="evenodd" d="M12 2C6.477 2 2 6.484 2 12.017c0 4.425 2.865 8.18 6.839 9.504.5.092.682-.217.682-.483 0-.237-.008-.868-.013-1.703-2.782.605-3.369-1.343-3.369-1.343-.454-1.158-1.11-1.466-1.11-1.466-.908-.62.069-.608.069-.608 1.003.07 1.53 1.032 1.53 1.032.892 1.53 2.341 1.088 2.91.832.092-.647.35-1.088.636-1.338-2.22-.253-4.555-1.113-4.555-4.951 0-1.093.39-1.988 1.029-2.688-.103-.253-.446-1.272.098-2.65 0 0 .84-.27 2.75 1.026A9.564 9.564 0 0112 6.844c.85.004 1.705.115 2.504.337 1.909-1.296 2.747-1.027 2.747-1.027.546 1.379.202 2.398.1 2.651.64.7 1.028 1.595 1.028 2.688 0 3.848-2.339 4.695-4.566 4.943.359.309.678.92.678 1.855 0 1.338-.012 2.419-.012 2.747 0 .268.18.58.688.482A10.019 10.019 0 0022 12.017C22 6.484 17.522 2 12 2z"/>
            </svg>
            <span>GitHub</span>
          </a>
        </div>
      </div>

      <!-- CONSOMMATION GEMINI & CLAUDE (SIMPLE & ÉPURÉ) -->
      <a
        href="./gemini-ultra/"
        class="mt-3.5 block rounded-2xl p-3 bg-white/[0.035] hover:bg-white/[0.055] border border-white/10 transition active:scale-[0.99] space-y-2.5"
      >
        <!-- Total Tokens + Estimation Prix (Hors Abonnement) -->
        <div class="flex items-center justify-between gap-2 px-0.5">
          <div class="flex items-center gap-2 min-w-0">
            <span id="gu-live-dot" class="w-2 h-2 rounded-full bg-emerald-400 shrink-0"></span>
            <span class="text-xs font-semibold text-slate-300 truncate">Total : <strong id="top-total-tokens" class="font-extrabold text-white tabular-nums">-- tokens</strong></span>
          </div>
          <div class="flex items-center gap-1.5 shrink-0">
            <span id="top-total-cost" class="px-2 py-0.5 rounded-lg bg-emerald-500/15 border border-emerald-400/25 text-xs font-extrabold text-emerald-300 tabular-nums">
              ~-- € (-- $)
            </span>
            <svg class="w-4 h-4 text-slate-400" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.2">
              <path stroke-linecap="round" stroke-linejoin="round" d="M9 5l7 7-7 7" />
            </svg>
          </div>
        </div>

        <!-- 2 Cartes simples côte à côte : GEMINI vs CLAUDE -->
        <div class="grid grid-cols-2 gap-2">
          <!-- Gemini -->
          <div class="p-2.5 rounded-xl bg-slate-950/75 border border-sky-400/20 space-y-1.5">
            <div class="flex items-center justify-between gap-1">
              <span class="text-xs font-extrabold text-sky-300">✨ Gemini</span>
              <span id="gem-cost" class="text-[11px] font-extrabold text-emerald-300 tabular-nums">~-- €</span>
            </div>
            <div class="flex items-baseline justify-between gap-1">
              <span id="gem-tokens" class="text-sm font-extrabold text-white tabular-nums">-- tok</span>
              <span id="gem-quotas" class="text-[10px] font-semibold text-slate-400 tabular-nums">5h --% • 7j --%</span>
            </div>
            <div class="w-full h-1.5 rounded-full bg-white/10 overflow-hidden">
              <div id="gem-bar" class="h-full rounded-full bg-gradient-to-r from-sky-400 to-emerald-400 transition-all duration-300" style="width: 100%"></div>
            </div>
          </div>

          <!-- Claude -->
          <div class="p-2.5 rounded-xl bg-slate-950/75 border border-amber-400/20 space-y-1.5">
            <div class="flex items-center justify-between gap-1">
              <span class="text-xs font-extrabold text-amber-300">🟠 Claude</span>
              <span id="claude-cost" class="text-[11px] font-extrabold text-emerald-300 tabular-nums">~-- €</span>
            </div>
            <div class="flex items-baseline justify-between gap-1">
              <span id="claude-tokens" class="text-sm font-extrabold text-white tabular-nums">-- tok</span>
              <span id="claude-quotas" class="text-[10px] font-semibold text-slate-400 tabular-nums">5h --% • 7j --%</span>
            </div>
            <div class="w-full h-1.5 rounded-full bg-white/10 overflow-hidden">
              <div id="claude-bar" class="h-full rounded-full bg-gradient-to-r from-amber-400 to-orange-400 transition-all duration-300" style="width: 100%"></div>
            </div>
          </div>
        </div>
      </a>

      <!-- RECHERCHE SIMPLE -->
      <div class="mt-3 relative">
        <svg class="w-4 h-4 text-slate-500 absolute left-3.5 top-1/2 -translate-y-1/2 pointer-events-none" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
          <path stroke-linecap="round" stroke-linejoin="round" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" />
        </svg>
        <input
          id="search-input"
          type="search"
          placeholder="Rechercher une application..."
          oninput="handleSearch(this.value)"
          class="w-full pl-10 pr-4 py-2.5 rounded-2xl bg-white/[0.04] border border-white/10 focus:border-cyan-400/50 focus:outline-none text-sm text-white placeholder-slate-500 transition"
        />
      </div>

      <!-- FILTRES PAR CATÉGORIES -->
      <div id="category-tabs" class="flex items-center gap-2 overflow-x-auto no-scrollbar mt-3 pt-0.5"></div>
    </header>

    <!-- LISTE DES PROJETS PAR CATÉGORIES -->
    <main id="projects-container" class="flex-1 space-y-6 pt-1"></main>

  </div>

  <script>
    const GITHUB_USERNAME = 'Mrthomaslef';
    const CACHE_KEY = 'allinone_live_repos_cache_v5';

    const CATEGORIES = [
      { id: 'medical-imaging', name: 'Imagerie & Radiologie', emoji: '🩺' },
      { id: 'clinical-calc',   name: 'Calculateurs Médicaux', emoji: '🧮' },
      { id: 'daily-tools',     name: 'Quotidien & Pratique',  emoji: '📦' },
      { id: 'games-family',    name: 'Jeux & Famille',        emoji: '🎮' }
    ];

    // Métadonnées & vrais logos officiels des applications en production
    const KNOWN_METADATA = {
      'm4-gaming': {
        title: 'M4 Gaming',
        subtitle: 'Télécommande Mac mini M4 (Mode TV 1080p/4K, ES-DE, Steam & Audio)',
        category: 'games-family',
        emoji: '🎮',
        prodUrl: 'http://192.168.1.111:8765',
        githubUrl: 'https://github.com/Mrthomaslef/m4-gaming',
        logoUrl: 'assets/m4-gaming-icon.png',
        alwaysInclude: true
      },
      'gemini-ultra': {
        title: 'Gemini Ultra & Claude Pro — Quotas Live',
        subtitle: 'Limites temps réel 5h, Semaine & Mois (Google AI Ultra + Claude Pro Apple)',
        category: 'daily-tools',
        emoji: '✨',
        prodUrl: 'https://mrthomaslef.github.io/allinone/gemini-ultra/',
        githubUrl: 'https://github.com/Mrthomaslef/allinone/tree/main/gemini-ultra',
        logoUrl: 'gemini-ultra/assets/icon.svg',
        alwaysInclude: true
      },
      'biblioosteo': {
        title: 'BiblioOstéo Cochin',
        subtitle: 'Portail bibliographique & résumés cliniques (RI & Ostéo)',
        category: 'medical-imaging',
        emoji: '🦴',
        logoUrl: 'https://mrthomaslef.github.io/biblioosteo/assets/icon.svg'
      },
      'agenda-cochin': {
        title: 'Cochin RI — Agenda',
        subtitle: 'Planning de Radiologie Interventionnelle (Cochin Radio B)',
        category: 'medical-imaging',
        emoji: '📅',
        logoUrl: 'https://mrthomaslef.github.io/agenda-cochin/apple-touch-icon.png'
      },
      'radio-thomas': {
        title: 'QUIZ Cochin',
        subtitle: 'Quiz d’imagerie musculosquelettique',
        category: 'medical-imaging',
        emoji: '🧠',
        prodUrl: 'https://radio-thomas-ten.vercel.app',
        logoUrl: 'https://radio-thomas-ten.vercel.app/apple-touch-icon.png'
      },
      'dicomviewer': {
        title: 'TPack PACS',
        subtitle: 'Visionneuse DICOM & imagerie médicale pédagogique',
        category: 'medical-imaging',
        emoji: '🖥️',
        logoUrl: 'https://mrthomaslef.github.io/dicomviewer/favicon.svg'
      },
      'tpack-cases': {
        title: 'TPack Cases',
        subtitle: 'Banque de cas cliniques d’imagerie (.tpack)',
        category: 'medical-imaging',
        emoji: '🗂️',
        logoUrl: 'https://mrthomaslef.github.io/tpack-cases/favicon.svg'
      },
      'tomatocalc': {
        title: 'TomatoCalc.',
        subtitle: 'Calculateurs médicaux, scores cliniques & classifications',
        category: 'clinical-calc',
        emoji: '🍅',
        logoUrl: 'https://mrthomaslef.github.io/Tomatocalc/image/logo2.png',
        logoFit: 'contain'
      },
      'medicalc': {
        title: 'MediCalc',
        subtitle: 'Calculateurs médicaux rapides & aide clinique',
        category: 'clinical-calc',
        emoji: '⚕️',
        logoUrl: 'https://mrthomaslef.github.io/Medicalc/image/logo2.png',
        logoFit: 'contain'
      },
      'colistrack': {
        title: 'ColisTrack',
        subtitle: 'Suivi de livraisons & colis (PWA privée)',
        category: 'daily-tools',
        emoji: '📦',
        logoUrl: 'https://mrthomaslef.github.io/colistrack/icon.svg'
      },
      'assistante-maternelle': {
        title: 'AssMat — Paie & Pajemploi',
        subtitle: 'Calculateur de salaire, présence & fiche de paie',
        category: 'daily-tools',
        emoji: '👶',
        logoUrl: 'https://mrthomaslef.github.io/assistante-maternelle/apple-touch-icon.png'
      },
      'quiz-trentenaires': {
        title: 'QUIZ du 7TER',
        subtitle: 'Grand Quiz Show multijoueur (2 couples / 4 joueurs)',
        category: 'games-family',
        emoji: '🎉',
        logoUrl: 'https://mrthomaslef.github.io/quiz-trentenaires/apple-touch-icon.png'
      },
      'pocket-tcg-family': {
        title: 'milTCG — Pocket Family',
        subtitle: 'Ouverture de boosters & collection de cartes en famille',
        category: 'games-family',
        emoji: '🃏',
        logoUrl: 'https://mrthomaslef.github.io/pocket-tcg-family/apple-touch-icon.png'
      },
      'holidamn': {
        title: 'Holidamn',
        subtitle: 'Portail vidéo & souvenirs de vacances',
        category: 'games-family',
        emoji: '🌴',
        logoUrl: 'https://mrthomaslef.github.io/Holidamn/image/logo7.png',
        logoFit: 'contain'
      }
    };

    function classifyNewRepo(repo) {
      const topics = (repo.topics || []).map(t => t.toLowerCase());
      const text = `${repo.name} ${repo.description || ''} ${topics.join(' ')}`.toLowerCase();

      if (topics.includes('imagerie') || topics.includes('radiologie') || /(cochin|osteo|dicom|pacs|radio|tpack|imagerie|irm|scanner|rx|echographie|anatomie)/.test(text)) {
        return { category: 'medical-imaging', emoji: '🩻' };
      }
      if (topics.includes('calculateur') || topics.includes('medical') || /(calc|score|medi|clinique|dose|formule|clairance)/.test(text)) {
        return { category: 'clinical-calc', emoji: '🧮' };
      }
      if (topics.includes('jeu') || topics.includes('famille') || /(quiz|tcg|game|jeu|holidamn|family|vacances|carte|soirée|blindtest|poker)/.test(text)) {
        return { category: 'games-family', emoji: '🎮' };
      }
      return { category: 'daily-tools', emoji: '🚀' };
    }

    function formatRepoTitle(name) {
      return name
        .replace(/[-_]+/g, ' ')
        .replace(/\b\w/g, l => l.toUpperCase());
    }

    function handleLogoError(imgEl) {
      const fallbacks = (imgEl.dataset.fallbacks || '').split('|').filter(Boolean);
      const step = parseInt(imgEl.dataset.step || '0', 10);
      if (step < fallbacks.length) {
        imgEl.dataset.step = String(step + 1);
        imgEl.src = fallbacks[step];
      } else {
        const emoji = imgEl.dataset.emoji || '🚀';
        const parent = imgEl.parentElement;
        if (parent) {
          parent.innerHTML = `<span class="text-xl select-none">${emoji}</span>`;
        }
      }
    }

    function getInitialProjects() {
      try {
        const cached = localStorage.getItem(CACHE_KEY);
        if (cached) {
          const parsed = JSON.parse(cached);
          if (Array.isArray(parsed) && parsed.length > 0) return parsed;
        }
      } catch (_) {}

      const canonicalCases = {
        'tomatocalc': 'Tomatocalc',
        'medicalc': 'Medicalc',
        'holidamn': 'Holidamn'
      };

      return Object.entries(KNOWN_METADATA).map(([key, meta]) => {
        const repoSlug = canonicalCases[key] || key;
        const prodUrl = meta.prodUrl || `https://mrthomaslef.github.io/${repoSlug}/`;
        return {
          id: repoSlug,
          title: meta.title,
          subtitle: meta.subtitle,
          category: meta.category,
          emoji: meta.emoji,
          logoUrl: meta.logoUrl,
          logoFit: meta.logoFit || 'cover',
          prodUrl,
          githubUrl: `https://github.com/${GITHUB_USERNAME}/${repoSlug}`,
          pushedAt: null,
          isNew: false
        };
      });
    }

    let projects = getInitialProjects();
    let activeCategory = 'all';
    let searchQuery = '';

    function renderTabs() {
      const tabsEl = document.getElementById('category-tabs');
      const allBtn = `
        <button onclick="setCategory('all')" class="shrink-0 px-3.5 py-1.5 rounded-full text-xs font-semibold transition ${
          activeCategory === 'all'
            ? 'bg-white text-slate-950'
            : 'bg-white/5 text-slate-400 hover:text-white'
        }">
          Tout (${projects.length})
        </button>
      `;

      const catBtns = CATEGORIES.map(cat => {
        const count = projects.filter(p => p.category === cat.id).length;
        const active = activeCategory === cat.id;
        return `
          <button onclick="setCategory('${cat.id}')" class="shrink-0 inline-flex items-center gap-1.5 px-3.5 py-1.5 rounded-full text-xs font-semibold transition ${
            active
              ? 'bg-white text-slate-950'
              : 'bg-white/5 text-slate-400 hover:text-white'
          }">
            <span>${cat.emoji}</span>
            <span>${cat.name}</span>
            <span class="opacity-60">${count}</span>
          </button>
        `;
      }).join('');

      tabsEl.innerHTML = allBtn + catBtns;
    }

    function renderAppLogo(p) {
      const base = p.prodUrl.replace(/\/$/, '');
      const fallbacks = [
        `${base}/apple-touch-icon.png`,
        `${base}/icon.svg`,
        `${base}/assets/icon.svg`,
        `${base}/favicon.svg`,
        `${base}/icon-192.png`,
        `${base}/favicon.png`
      ].filter(u => u !== p.logoUrl).join('|');

      const fitClass = p.logoFit === 'contain'
        ? 'w-full h-full object-contain p-1.5 bg-slate-900'
        : 'w-full h-full object-cover';

      return `
        <div class="w-12 h-12 rounded-2xl bg-slate-900/90 border border-white/10 overflow-hidden flex items-center justify-center shrink-0 shadow-md">
          <img
            src="${p.logoUrl}"
            alt="${p.title}"
            data-fallbacks="${fallbacks}"
            data-emoji="${p.emoji || '🚀'}"
            onerror="handleLogoError(this)"
            loading="lazy"
            class="${fitClass}"
          />
        </div>
      `;
    }

    function renderProjects() {
      const container = document.getElementById('projects-container');
      const q = searchQuery.trim().toLowerCase();

      const visibleCategories = activeCategory === 'all'
        ? CATEGORIES
        : CATEGORIES.filter(c => c.id === activeCategory);

      let html = '';

      visibleCategories.forEach(cat => {
        const items = projects.filter(p => {
          if (p.category !== cat.id) return false;
          if (!q) return true;
          return `${p.title} ${p.subtitle} ${p.id}`.toLowerCase().includes(q);
        });

        if (items.length === 0) return;

        html += `
          <section class="space-y-2.5">
            <div class="flex items-center justify-between px-1">
              <h2 class="text-xs font-bold uppercase tracking-wider text-slate-400 flex items-center gap-2">
                <span>${cat.emoji}</span>
                <span>${cat.name}</span>
              </h2>
              <span class="text-xs text-slate-600 font-medium">${items.length}</span>
            </div>

            <div class="space-y-2">
              ${items.map(p => `
                <div class="app-card rounded-2xl p-3 flex items-center justify-between gap-3">
                  <a href="${p.prodUrl}" target="_blank" rel="noopener" class="flex items-center gap-3.5 min-w-0 flex-1">
                    ${renderAppLogo(p)}
                    <div class="min-w-0 flex-1">
                      <div class="flex items-center gap-2">
                        <span class="text-sm font-bold text-white truncate">${p.title}</span>
                        ${p.isNew ? '<span class="px-1.5 py-0.5 text-[10px] font-bold uppercase rounded-md bg-emerald-500/20 text-emerald-300 border border-emerald-500/30 shrink-0">Nouveau</span>' : ''}
                      </div>
                      <div class="text-xs text-slate-400 truncate mt-0.5">${p.subtitle}</div>
                    </div>
                  </a>

                  <div class="flex items-center gap-1.5 shrink-0">
                    <a
                      href="${p.githubUrl}"
                      target="_blank"
                      rel="noopener"
                      title="Code source GitHub"
                      class="p-2.5 rounded-xl bg-white/5 hover:bg-white/10 text-slate-400 hover:text-white transition"
                    >
                      <svg class="w-4 h-4" fill="currentColor" viewBox="0 0 24 24">
                        <path fill-rule="evenodd" clip-rule="evenodd" d="M12 2C6.477 2 2 6.484 2 12.017c0 4.425 2.865 8.18 6.839 9.504.5.092.682-.217.682-.483 0-.237-.008-.868-.013-1.703-2.782.605-3.369-1.343-3.369-1.343-.454-1.158-1.11-1.466-1.11-1.466-.908-.62.069-.608.069-.608 1.003.07 1.53 1.032 1.53 1.032.892 1.53 2.341 1.088 2.91.832.092-.647.35-1.088.636-1.338-2.22-.253-4.555-1.113-4.555-4.951 0-1.093.39-1.988 1.029-2.688-.103-.253-.446-1.272.098-2.65 0 0 .84-.27 2.75 1.026A9.564 9.564 0 0112 6.844c.85.004 1.705.115 2.504.337 1.909-1.296 2.747-1.027 2.747-1.027.546 1.379.202 2.398.1 2.651.64.7 1.028 1.595 1.028 2.688 0 3.848-2.339 4.695-4.566 4.943.359.309.678.92.678 1.855 0 1.338-.012 2.419-.012 2.747 0 .268.18.58.688.482A10.019 10.019 0 0022 12.017C22 6.484 17.522 2 12 2z"/>
                      </svg>
                    </a>

                    <a
                      href="${p.prodUrl}"
                      target="_blank"
                      rel="noopener"
                      class="px-3 py-2 rounded-xl bg-cyan-500/15 hover:bg-cyan-500/25 text-cyan-300 font-semibold text-xs flex items-center gap-1 transition"
                    >
                      <span>Ouvrir</span>
                      <svg class="w-3.5 h-3.5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.2">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M7 17L17 7M17 7H8M17 7V16" />
                      </svg>
                    </a>
                  </div>
                </div>
              `).join('')}
            </div>
          </section>
        `;
      });

      if (!html) {
        html = `
          <div class="text-center py-12 text-sm text-slate-500">
            Aucun projet trouvé pour « ${searchQuery} ».
          </div>
        `;
      }

      container.innerHTML = html;
    }

    function setCategory(catId) {
      activeCategory = catId;
      renderTabs();
      renderProjects();
    }

    function handleSearch(val) {
      searchQuery = val;
      renderProjects();
    }

    // Synchronisation temps réel avec l'API GitHub (détecte immédiatement tout nouveau repo en prod + son vrai logo)
    async function syncFromGitHub(manual = false) {
      const refreshIcon = document.getElementById('refresh-icon');
      const subtitle = document.getElementById('sync-subtitle');
      if (refreshIcon && manual) refreshIcon.classList.add('animate-spin');

      try {
        const [apiRes, jsonRes] = await Promise.allSettled([
          fetch(`https://api.github.com/users/${GITHUB_USERNAME}/repos?per_page=100&sort=pushed`, {
            headers: { 'Accept': 'application/vnd.github+json' },
            cache: 'no-store'
          }),
          fetch(`./projects.json?t=${Date.now()}`, { cache: 'no-store' })
        ]);

        let jsonTitles = {};
        if (jsonRes.status === 'fulfilled' && jsonRes.value.ok) {
          const data = await jsonRes.value.json();
          if (Array.isArray(data)) {
            data.forEach(item => {
              if (item.id) jsonTitles[item.id.toLowerCase()] = item;
            });
          }
        }

        if (apiRes.status === 'fulfilled' && apiRes.value.ok) {
          const repos = await apiRes.value.json();
          const syncedList = [];

          repos.forEach(r => {
            if (!r || !r.name) return;
            const key = r.name.toLowerCase();
            if (key === 'allinone') return;

            const known = KNOWN_METADATA[key];
            const fromManifest = jsonTitles[key];
            const hasLiveUrl = Boolean(r.has_pages || (r.homepage && r.homepage.trim().startsWith('http')) || known);

            if (!hasLiveUrl) return;

            const autoClass = classifyNewRepo(r);
            const prodUrl = (r.homepage && r.homepage.trim().startsWith('http'))
              ? r.homepage.trim()
              : (known && known.prodUrl)
                ? known.prodUrl
                : `https://${GITHUB_USERNAME.toLowerCase()}.github.io/${r.name}/`;

            const logoUrl = (known && known.logoUrl)
              || (fromManifest && fromManifest.logoUrl)
              || `${prodUrl.replace(/\/$/, '')}/apple-touch-icon.png`;

            const isBrandNew = !known;

            syncedList.push({
              id: r.name,
              title: (known && known.title) || (fromManifest && fromManifest.title) || formatRepoTitle(r.name),
              subtitle: (known && known.subtitle) || r.description || (fromManifest && fromManifest.subtitle) || 'Application en production sur GitHub',
              category: (known && known.category) || (fromManifest && fromManifest.category) || autoClass.category,
              emoji: (known && known.emoji) || (fromManifest && fromManifest.emoji) || autoClass.emoji,
              logoUrl,
              logoFit: (known && known.logoFit) || 'cover',
              prodUrl,
              githubUrl: r.html_url || `https://github.com/${GITHUB_USERNAME}/${r.name}`,
              pushedAt: r.pushed_at || r.updated_at,
              isNew: isBrandNew
            });
          });

          // Inclure systématiquement les web-apps intégrées marquées alwaysInclude (ex: gemini-ultra)
          Object.entries(KNOWN_METADATA).forEach(([k, meta]) => {
            if (meta.alwaysInclude && !syncedList.some(item => item.id.toLowerCase() === k)) {
              syncedList.unshift({
                id: k,
                title: meta.title,
                subtitle: meta.subtitle,
                category: meta.category,
                emoji: meta.emoji,
                logoUrl: meta.logoUrl,
                logoFit: meta.logoFit || 'cover',
                prodUrl: meta.prodUrl,
                githubUrl: meta.githubUrl || `https://github.com/${GITHUB_USERNAME}/allinone`,
                pushedAt: new Date().toISOString(),
                isNew: true
              });
            }
          });

          if (syncedList.length > 0) {
            projects = syncedList;
            localStorage.setItem(CACHE_KEY, JSON.stringify(projects));
            renderTabs();
            renderProjects();
          }

          if (subtitle) {
            const nowStr = new Date().toLocaleTimeString('fr-FR', { hour: '2-digit', minute: '2-digit' });
            subtitle.textContent = `${projects.length} projets en prod • Mis à jour à ${nowStr}`;
          }
        }
      } catch (_) {
      } finally {
        syncGeminiUltraWidget(manual);
        if (refreshIcon) setTimeout(() => refreshIcon.classList.remove('animate-spin'), 400);
      }
    }

    const QUOTA_WIDGET_CACHE_KEY = 'allinone_live_quota_widget_v3';
    let lastQuotaData = null;

    function formatCompactTokens(n) {
      const val = Number(n) || 0;
      if (val <= 0) return '0';
      if (val >= 1e9) return (val / 1e9).toFixed(2).replace('.', ',') + ' Md';
      if (val >= 1e6) return (val / 1e6).toFixed(1).replace('.', ',') + ' M';
      if (val >= 1e3) return Math.round(val / 1e3) + ' k';
      return String(val);
    }

    function formatUsd(val) {
      const n = Number(val) || 0;
      if (n >= 100) return Math.round(n).toLocaleString('fr-FR') + ' $';
      if (n >= 10) return n.toFixed(1).replace('.', ',') + ' $';
      return n.toFixed(2).replace('.', ',') + ' $';
    }

    function formatEur(val) {
      const n = Number(val) || 0;
      if (n >= 100) return '~' + Math.round(n).toLocaleString('fr-FR') + ' €';
      if (n >= 10) return '~' + n.toFixed(1).replace('.', ',') + ' €';
      return '~' + n.toFixed(2).replace('.', ',') + ' €';
    }

    function renderTopQuotaAndTokens(data) {
      if (!data || !data.windows) return;
      lastQuotaData = data;

      const ts = data.tokenSummary || {};
      const w5 = data.windows.fiveHour || {};
      const ww = data.windows.weekly || {};
      const wm = data.windows.monthly || {};
      const c5 = data.windows.claudeFiveHour || { remainingPercent: 100 };
      const cw = data.windows.claudeWeekly || { remainingPercent: 100 };

      const byModel = ts.byModel || [];
      const gemModel = ts.gemini || byModel.find(m => !m.id.includes('claude')) || {};
      const claudeModel = ts.claude || byModel.find(m => m.id.includes('claude')) || {};

      const totTokens = ts.thirtyDays?.activeTokens || wm.tokensRolling30d || wm.tokensCount || 0;
      const totUsd = ts.thirtyDays?.apiCostUsd ?? wm.apiCostUsd30d ?? ((totTokens * 6.0) / 1e6);
      const totEur = ts.thirtyDays?.apiCostEur ?? wm.apiCostEur30d ?? (totUsd * 0.92);

      const gemTok = gemModel.activeTokens ?? Math.round(totTokens * 0.96);
      const gemUsd = gemModel.apiCostUsd ?? (totUsd * 0.91);
      const gemEur = gemModel.apiCostEur ?? (gemUsd * 0.92);

      const claudeTok = claudeModel.activeTokens ?? Math.max(0, totTokens - gemTok);
      const claudeUsd = claudeModel.apiCostUsd ?? Math.max(0, totUsd - gemUsd);
      const claudeEur = claudeModel.apiCostEur ?? (claudeUsd * 0.92);

      const g5Rem = Math.round(w5.remainingPercent ?? 100);
      const gwRem = Math.round(ww.remainingPercent ?? 100);
      const c5Rem = Math.round(c5.remainingPercent ?? 100);
      const cwRem = Math.round(cw.remainingPercent ?? 100);

      const totTokEl = document.getElementById('top-total-tokens');
      const totCostEl = document.getElementById('top-total-cost');
      if (totTokEl) totTokEl.textContent = `${formatCompactTokens(totTokens)} tokens`;
      if (totCostEl) totCostEl.textContent = `${formatEur(totEur)} (${formatUsd(totUsd)})`;

      const gemCostEl = document.getElementById('gem-cost');
      const gemTokEl = document.getElementById('gem-tokens');
      const gemQuotasEl = document.getElementById('gem-quotas');
      const gemBarEl = document.getElementById('gem-bar');
      if (gemCostEl) gemCostEl.textContent = `${formatEur(gemEur)} (${formatUsd(gemUsd)})`;
      if (gemTokEl) gemTokEl.textContent = `${formatCompactTokens(gemTok)} tok`;
      if (gemQuotasEl) gemQuotasEl.textContent = `5h ${g5Rem}% • 7j ${gwRem}%`;
      if (gemBarEl) gemBarEl.style.width = `${Math.max(4, Math.min(g5Rem, gwRem))}%`;

      const claudeCostEl = document.getElementById('claude-cost');
      const claudeTokEl = document.getElementById('claude-tokens');
      const claudeQuotasEl = document.getElementById('claude-quotas');
      const claudeBarEl = document.getElementById('claude-bar');
      if (claudeCostEl) claudeCostEl.textContent = `${formatEur(claudeEur)} (${formatUsd(claudeUsd)})`;
      if (claudeTokEl) claudeTokEl.textContent = `${formatCompactTokens(claudeTok)} tok`;
      if (claudeQuotasEl) claudeQuotasEl.textContent = `5h ${c5Rem}% • 7j ${cwRem}%`;
      if (claudeBarEl) claudeBarEl.style.width = `${Math.max(4, Math.min(c5Rem, cwRem))}%`;
    }

    async function fetchJsonWithTimeout(url, timeoutMs = 2200) {
      const ctrl = new AbortController();
      const tid = setTimeout(() => ctrl.abort(), timeoutMs);
      try {
        const res = await fetch(url, { cache: 'no-store', signal: ctrl.signal });
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        return await res.json();
      } finally {
        clearTimeout(tid);
      }
    }

    async function syncGeminiUltraWidget(manual = false) {
      try {
        const cached = localStorage.getItem(QUOTA_WIDGET_CACHE_KEY);
        if (cached && !lastQuotaData) {
          renderTopQuotaAndTokens(JSON.parse(cached));
        }
      } catch (_) {}

      let data = null;
      try {
        data = await fetchJsonWithTimeout(`http://127.0.0.1:8787/api/quota?refresh=${manual ? 1 : 0}&t=${Date.now()}`, 1800);
      } catch (_) {}

      if (!data) {
        const [rawRes, localRes] = await Promise.allSettled([
          fetchJsonWithTimeout(`https://raw.githubusercontent.com/Mrthomaslef/allinone/main/gemini-ultra/quota-live.json?t=${Date.now()}`, 2800),
          fetchJsonWithTimeout(`./gemini-ultra/quota-live.json?t=${Date.now()}`, 2200)
        ]);
        if (rawRes.status === 'fulfilled' && rawRes.value?.windows) data = rawRes.value;
        if (localRes.status === 'fulfilled' && localRes.value?.windows) {
          if (!data || Date.parse(localRes.value.checkedAt) >= Date.parse(data.checkedAt)) {
            data = localRes.value;
          }
        }
        const tunnelUrl = data?.tunnelUrl || lastQuotaData?.tunnelUrl;
        if (tunnelUrl) {
          try {
            const tData = await fetchJsonWithTimeout(`${tunnelUrl.replace(/\/$/, '')}/api/quota?refresh=${manual ? 1 : 0}&t=${Date.now()}`, 2800);
            if (tData && tData.windows) data = tData;
          } catch (_) {}
        }
      }

      if (data && data.windows) {
        try {
          localStorage.setItem(QUOTA_WIDGET_CACHE_KEY, JSON.stringify(data));
        } catch (_) {}
        renderTopQuotaAndTokens(data);
      }
    }

    // --- PULL-TO-REFRESH (Glisser vers le bas sur mobile & trackpad/souris) ---
    function initPullToRefresh() {
      const ptrContainer = document.getElementById('ptr-container');
      const ptrSpinner = document.getElementById('ptr-spinner');
      const ptrLabel = document.getElementById('ptr-label');

      const THRESHOLD = 68;
      const MAX_PULL = 115;
      let startY = 0;
      let currentPull = 0;
      let isPulling = false;
      let isRefreshing = false;

      const setArrowIcon = () => {
        ptrSpinner.classList.remove('animate-spin');
        ptrSpinner.innerHTML = `<path stroke-linecap="round" stroke-linejoin="round" d="M19 14l-7 7m0 0l-7-7m7 7V3" />`;
      };

      const setSpinIcon = () => {
        ptrSpinner.style.transform = 'rotate(0deg)';
        ptrSpinner.classList.add('animate-spin');
        ptrSpinner.innerHTML = `<path stroke-linecap="round" stroke-linejoin="round" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15" />`;
      };

      const onStart = (y) => {
        if (isRefreshing || window.scrollY > 2) return;
        startY = y;
        currentPull = 0;
        isPulling = true;
      };

      const onMove = (y, event) => {
        if (!isPulling || isRefreshing) return;
        const delta = y - startY;
        if (delta <= 0 || window.scrollY > 2) {
          if (currentPull > 0) {
            ptrContainer.style.height = '0px';
            ptrContainer.style.opacity = '0';
            currentPull = 0;
          }
          return;
        }

        // Résistance élastique naturelle type iOS
        currentPull = Math.min(MAX_PULL, Math.pow(delta, 0.82) * 1.6);
        if (currentPull > 6 && event && event.cancelable) {
          event.preventDefault();
        }

        ptrContainer.classList.add('dragging');
        ptrContainer.style.height = `${currentPull}px`;
        ptrContainer.style.opacity = String(Math.min(1, currentPull / (THRESHOLD * 0.85)));

        if (currentPull >= THRESHOLD) {
          ptrSpinner.style.transform = 'rotate(180deg)';
          ptrLabel.textContent = 'Relâcher pour actualiser';
        } else {
          ptrSpinner.style.transform = 'rotate(0deg)';
          ptrLabel.textContent = 'Tirer pour actualiser';
        }
      };

      const onEnd = async () => {
        if (!isPulling || isRefreshing) return;
        isPulling = false;
        ptrContainer.classList.remove('dragging');

        if (currentPull >= THRESHOLD) {
          isRefreshing = true;
          ptrContainer.style.height = '54px';
          ptrContainer.style.opacity = '1';
          ptrLabel.textContent = 'Actualisation GitHub...';
          setSpinIcon();
          if (navigator.vibrate) navigator.vibrate(12);

          await syncFromGitHub(true);

          ptrLabel.textContent = 'À jour ✓';
          ptrSpinner.classList.remove('animate-spin');
          setTimeout(() => {
            ptrContainer.style.height = '0px';
            ptrContainer.style.opacity = '0';
            setTimeout(() => {
              setArrowIcon();
              isRefreshing = false;
            }, 250);
          }, 450);
        } else {
          ptrContainer.style.height = '0px';
          ptrContainer.style.opacity = '0';
        }
        currentPull = 0;
      };

      // Événements tactiles (iOS / Android PWA)
      window.addEventListener('touchstart', (e) => {
        if (e.touches.length === 1) onStart(e.touches[0].clientY);
      }, { passive: true });

      window.addEventListener('touchmove', (e) => {
        if (e.touches.length === 1) onMove(e.touches[0].clientY, e);
      }, { passive: false });

      window.addEventListener('touchend', onEnd, { passive: true });
      window.addEventListener('touchcancel', onEnd, { passive: true });

      // Support souris sur ordinateur (drag vers le bas depuis le haut)
      window.addEventListener('mousedown', (e) => {
        if (e.button === 0 && !['INPUT', 'BUTTON', 'A'].includes(e.target.tagName)) {
          onStart(e.clientY);
        }
      });
      window.addEventListener('mousemove', (e) => {
        if (isPulling) onMove(e.clientY, null);
      });
      window.addEventListener('mouseup', onEnd);
    }

    renderTabs();
    renderProjects();
    initPullToRefresh();
    syncGeminiUltraWidget(false);
    syncFromGitHub(false);

    setInterval(() => {
      if (document.visibilityState === 'visible') {
        syncGeminiUltraWidget(false);
      }
    }, 25000);

    document.addEventListener('visibilitychange', () => {
      if (document.visibilityState === 'visible') {
        syncFromGitHub(false);
      }
    });
  </script>
