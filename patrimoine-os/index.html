    function base64ToUint8Array(b64) {
      const bin = atob(b64);
      const arr = new Uint8Array(bin.length);
      for (let i = 0; i < bin.length; i++) arr[i] = bin.charCodeAt(i);
      return arr;
    }

    async function decryptVaultWithPin(pinCode) {
      try {
        const enc = new TextEncoder();
        const keyMaterial = await window.crypto.subtle.importKey(
          "raw",
          enc.encode(pinCode),
          { name: "PBKDF2" },
          false,
          ["deriveKey"]
        );
        const salt = base64ToUint8Array(ENCRYPTED_VAULT.salt);
        const iv = base64ToUint8Array(ENCRYPTED_VAULT.iv);
        const ct = base64ToUint8Array(ENCRYPTED_VAULT.ct);

        const aesKey = await window.crypto.subtle.deriveKey(
          {
            name: "PBKDF2",
            salt,
            iterations: ENCRYPTED_VAULT.iterations,
            hash: "SHA-256",
          },
          keyMaterial,
          { name: "AES-GCM", length: 256 },
          false,
          ["decrypt"]
        );

        const decryptedBuf = await window.crypto.subtle.decrypt(
          { name: "AES-GCM", iv },
          aesKey,
          ct
        );
        const jsonStr = new TextDecoder().decode(decryptedBuf);
        return JSON.parse(jsonStr);
      } catch (e) {
        return null;
      }
    }

    function loadLocalBankAccounts(baseData) {
      try {
        const saved = localStorage.getItem("patrimoine_os_local_banks_v1");
        if (saved) {
          const parsed = JSON.parse(saved);
          if (Array.isArray(parsed)) {
            baseData.bankAccounts = parsed;
          }
        }
      } catch {}
      recomputeTotals(baseData);
      return baseData;
    }

    function recomputeTotals(d) {
      if (!d) return;
      const bankTotal = (d.bankAccounts || []).reduce((acc, b) => acc + (Number(b.balanceEur) || 0), 0);
      const cryptoTotal = (d.cryptoHoldings || []).reduce((acc, h) => acc + (Number(h.valueEur) || 0), 0);
      const pokemonTotal = (d.pokemonItems || []).reduce((acc, p) => acc + (Number(p.totalValueEur) || 0), 0);
      const total = bankTotal + cryptoTotal + pokemonTotal;
      d.totals = {
        totalNetWorthEur: total,
        bankTotalEur: bankTotal,
        cryptoTotalEur: cryptoTotal,
        pokemonTotalEur: pokemonTotal,
        allocationPct: {
          bank: total > 0 ? (bankTotal / total) * 100 : 0,
          crypto: total > 0 ? (cryptoTotal / total) * 100 : 0,
          pokemon: total > 0 ? (pokemonTotal / total) * 100 : 0,
        }
      };
      for (const w of d.cryptoWallets || []) {
        w.totalValueEur = (d.cryptoHoldings || [])
          .filter(h => h.walletId === w.id)
          .reduce((s, h) => s + (Number(h.valueEur) || 0), 0);
      }
    }

    async function refreshLiveMarketPrices() {
      if (!state.data || state.isRefreshing) return;
      state.isRefreshing = true;
      state.syncStatus = "Actualisation des cours live...";
      render();

      // 1. Try syncing from live Mac tunnel if online
      try {
        const ctrl = new AbortController();
        const timer = setTimeout(() => ctrl.abort(), 3500);
        const res = await fetch(LIVE_TUNNEL_URL + "/api/portfolio", { signal: ctrl.signal });
        clearTimeout(timer);
        if (res.ok) {
          const liveData = await res.json();
          if (liveData && liveData.totals) {
            state.data = loadLocalBankAccounts(liveData);
            state.syncStatus = "Synchronisé en direct avec le Mac (4G/5G)";
            state.isRefreshing = false;
            render();
            return;
          }
        }
      } catch {}

      // 2. Otherwise refresh live BTC / WBTC / ETH / BNB / USDC prices in EUR directly from CoinGecko
      try {
        const cgRes = await fetch("https://api.coingecko.com/api/v3/simple/price?ids=bitcoin,wrapped-bitcoin,ethereum,usd-coin,binancecoin,matic-network&vs_currencies=eur,usd&include_24hr_change=true");
        if (cgRes.ok) {
          const prices = await cgRes.json();
          const mapId = {
            BTC: "bitcoin",
            aWBTC: "wrapped-bitcoin",
            WBTC: "wrapped-bitcoin",
            ETH: "ethereum",
            WETH: "ethereum",
            USDC: "usd-coin",
            "USDC.e": "usd-coin",
            debtUSDC: "usd-coin",
            BNB: "binancecoin",
            POL: "matic-network",
          };
          for (const h of state.data.cryptoHoldings || []) {
            const cgKey = mapId[h.symbol];
            if (cgKey && prices[cgKey] && prices[cgKey].eur) {
              h.priceEur = prices[cgKey].eur;
              h.priceUsd = prices[cgKey].usd || h.priceUsd;
              h.change24hPct = prices[cgKey].eur_24h_change || h.change24hPct;
              h.valueEur = h.balance * h.priceEur;
            }
          }
          recomputeTotals(state.data);
          state.syncStatus = "Cours Crypto EUR actualisés en direct (4G/5G)";
        }
      } catch {
        state.syncStatus = "Mode Coffre Autonome (4G/5G)";
      }
      state.isRefreshing = false;
      render();
    }

    function formatEur(val) {
      if (state.hideAmounts) return "•••• €";
      const n = Number(val) || 0;
      return new Intl.NumberFormat("fr-FR", {
        style: "currency",
        currency: "EUR",
        maximumFractionDigits: Math.abs(n) >= 1000 ? 0 : 2,
      }).format(n);
    }

    function formatEurPrecise(val) {
      if (state.hideAmounts) return "••••••,•• €";
      const n = Number(val) || 0;
      return new Intl.NumberFormat("fr-FR", {
        style: "currency",
        currency: "EUR",
        minimumFractionDigits: 2,
        maximumFractionDigits: 2,
      }).format(n);
    }

    async function handlePinInput(digit) {
      if (state.pin.length >= 4) return;
      state.pinError = false;
      state.pin += digit;
      render();

      if (state.pin.length === 4) {
        const decrypted = await decryptVaultWithPin(state.pin);
        if (decrypted) {
          state.data = loadLocalBankAccounts(decrypted);
          state.unlocked = true;
          if (state.rememberDevice) {
            localStorage.setItem("patrimoine_os_pin_v1", state.pin);
          }
          render();
          refreshLiveMarketPrices();
        } else {
          state.pinError = true;
          render();
          setTimeout(() => {
            state.pin = "";
            state.pinError = false;
            render();
          }, 500);
        }
      }
    }

    function handleBackspace() {
      state.pinError = false;
      state.pin = state.pin.slice(0, -1);
      render();
    }

    function lockVault() {
      localStorage.removeItem("patrimoine_os_pin_v1");
      state.unlocked = false;
      state.pin = "";
      state.data = null;
      render();

    function addOrUpdateBankAccount(e) {
      e.preventDefault();
      if (!state.newBankName || state.newBankBalance === "") return;
      const bal = parseFloat(String(state.newBankBalance).replace(",", "."));
      if (isNaN(bal)) return;
      const banks = state.data.bankAccounts || [];
      const existingIdx = banks.findIndex(b => b.name.toLowerCase() === state.newBankName.toLowerCase());
      const item = {
        id: existingIdx >= 0 ? banks[existingIdx].id : "cm-" + Date.now(),
        institution: "Crédit Mutuel",
        name: state.newBankName,
        type: state.newBankType,
        ibanMasked: "FR76 •••• •••• •••• (Masqué)",
        balanceEur: bal,
        lastSync: new Date().toISOString(),
        source: "manual"
      };
      if (existingIdx >= 0) banks[existingIdx] = item;
      else banks.push(item);
      state.data.bankAccounts = banks;
      localStorage.setItem("patrimoine_os_local_banks_v1", JSON.stringify(banks));
      state.newBankBalance = "";
      recomputeTotals(state.data);
      render();
    }

    function deleteBankAccount(id) {
      state.data.bankAccounts = (state.data.bankAccounts || []).filter(b => b.id !== id);
      localStorage.setItem("patrimoine_os_local_banks_v1", JSON.stringify(state.data.bankAccounts));
      recomputeTotals(state.data);
      render();
    }

      let content = "";
      if (state.activeTab === "overview") content = renderOverviewTab(d);
      else if (state.activeTab === "bank") content = renderBankTab(d);
      else if (state.activeTab === "crypto") content = renderCryptoTab(d);
      else if (state.activeTab === "pokemon") content = renderPokemonTab(d);

      root.innerHTML = `
        <div class="min-h-screen flex flex-col">
          <header class="sticky top-0 z-30 border-b border-slate-800/80 bg-[#07090e]/90 backdrop-blur-xl">
            <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between gap-3">
              <div class="flex items-center gap-3">
                <a href="../" class="text-xs text-slate-400 hover:text-white px-2.5 py-1.5 rounded-xl bg-slate-900 border border-slate-800">
                  ← Tapp Store
                </a>
                <div>
                  <div class="flex items-center gap-2">
                    <h1 class="font-bold text-base sm:text-lg tracking-tight text-white">
                      Patrimoine<span class="text-indigo-400">OS</span>
                    </h1>
                    <span class="hidden md:inline-flex items-center gap-1 px-2 py-0.5 rounded-full text-[11px] font-medium bg-emerald-950/90 text-emerald-300 border border-emerald-500/30">
                      🔒 Coffre PIN Chiffré
                    </span>
                  </div>
                </div>
              </div>

              <div class="flex items-center gap-2 overflow-x-auto">
                <button onclick="refreshLiveMarketPrices()" class="px-3 py-1.5 rounded-xl border border-indigo-500/30 bg-indigo-500/10 text-indigo-300 hover:bg-indigo-500/20 text-xs font-medium transition shrink-0">
                  ${state.isRefreshing ? "⏳ Sync..." : "🔄 Actualiser 4G/5G"}
                </button>
                <button onclick="state.hideAmounts=!state.hideAmounts;render();" class="px-3 py-1.5 rounded-xl border border-slate-800 bg-slate-900 text-slate-300 hover:text-white text-xs font-medium transition shrink-0">
                  ${state.hideAmounts ? "🙈 Masqué" : "👁️ Discret"}
                </button>
                <button onclick="lockVault()" class="px-3 py-1.5 rounded-xl border border-rose-500/30 bg-rose-500/10 text-rose-300 hover:bg-rose-500/20 text-xs font-medium transition shrink-0">
                  🔒 Verrouiller
                </button>
              </div>
            </div>

            <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 pb-2.5 flex items-center gap-1.5 overflow-x-auto">
              ${[
                { id: "overview", label: "📊 Vue Globale" },
                { id: "bank", label: "🏦 Crédit Mutuel" },
                { id: "crypto", label: "⛓️ MetaMask & Ledger" },
                { id: "pokemon", label: "✨ Pokémon Collectr" }
              ].map(tab => `
                <button onclick="state.activeTab='${tab.id}';render();" class="px-3.5 py-1.5 rounded-xl text-xs font-semibold transition shrink-0 ${state.activeTab === tab.id ? 'bg-indigo-600 text-white shadow-sm' : 'bg-slate-900/90 text-slate-400 hover:text-white border border-slate-800'}">
                  ${tab.label}
                </button>
              `).join("")}
            </div>
          </header>

          <main class="flex-1 max-w-7xl w-full mx-auto px-4 sm:px-6 lg:px-8 py-6">
            ${content}
          </main>
        </div>
      `;
    }

    // Auto-unlock if saved on device
    (async () => {
      const savedPin = localStorage.getItem("patrimoine_os_pin_v1");
      if (savedPin && savedPin.length === 4) {
        const decrypted = await decryptVaultWithPin(savedPin);
        if (decrypted) {
          state.data = loadLocalBankAccounts(decrypted);
          state.unlocked = true;
          render();
          refreshLiveMarketPrices();
          return;
        }
      }
      render();
    })();
  </script>
</body>
</html>
