        const salt = base64ToUint8Array(ENCRYPTED_VAULT.salt);
        const iv = base64ToUint8Array(ENCRYPTED_VAULT.iv);
        const ct = base64ToUint8Array(ENCRYPTED_VAULT.ct);

        const aesKey = await window.crypto.subtle.deriveKey(
          {
            name: "PBKDF2",
            salt,
            iterations: ENCRYPTED_VAULT.iterations,
            hash: "SHA-256",
          },
          keyMaterial,
          { name: "AES-GCM", length: 256 },
          false,
          ["decrypt"]
        );

        const decryptedBuf = await window.crypto.subtle.decrypt(
          { name: "AES-GCM", iv },
          aesKey,
          ct
        );
        const jsonStr = new TextDecoder().decode(decryptedBuf);
        return JSON.parse(jsonStr);
      } catch (e) {
        return null;
      }
    }

    function loadLocalBankAccounts(baseData) {
      try {
        const saved = localStorage.getItem("patrimoine_os_local_banks_v1");
        if (saved) {
          const parsed = JSON.parse(saved);
          if (Array.isArray(parsed)) {
            baseData.bankAccounts = parsed;
          }
        }
      } catch {}
      recomputeTotals(baseData);
      return baseData;
    }

    function recomputeTotals(d) {
      if (!d) return;
      const bankTotal = (d.bankAccounts || []).reduce((acc, b) => acc + (Number(b.balanceEur) || 0), 0);
      const cryptoTotal = (d.cryptoHoldings || []).reduce((acc, h) => acc + (Number(h.valueEur) || 0), 0);
      const pokemonTotal = (d.pokemonItems || []).reduce((acc, p) => acc + (Number(p.totalValueEur) || 0), 0);
      const total = bankTotal + cryptoTotal + pokemonTotal;
      d.totals = {
        totalNetWorthEur: total,
        bankTotalEur: bankTotal,
        cryptoTotalEur: cryptoTotal,
        pokemonTotalEur: pokemonTotal,
        allocationPct: {
          bank: total > 0 ? (bankTotal / total) * 100 : 0,
          crypto: total > 0 ? (cryptoTotal / total) * 100 : 0,
          pokemon: total > 0 ? (pokemonTotal / total) * 100 : 0,
        }
      };
      for (const w of d.cryptoWallets || []) {
        w.totalValueEur = (d.cryptoHoldings || [])
          .filter(h => h.walletId === w.id)
          .reduce((s, h) => s + (Number(h.valueEur) || 0), 0);
      }
    }

    async function refreshLiveMarketPrices() {
      if (!state.data || state.isRefreshing) return;
      state.isRefreshing = true;
      state.syncStatus = "Actualisation des cours live...";
      render();

      // 1. Try syncing from live Mac tunnel if online
      try {
        const ctrl = new AbortController();
        const timer = setTimeout(() => ctrl.abort(), 3500);
        const res = await fetch(LIVE_TUNNEL_URL + "/api/portfolio", { signal: ctrl.signal });
        clearTimeout(timer);
        if (res.ok) {
          const liveData = await res.json();
          if (liveData && liveData.totals) {
            state.data = loadLocalBankAccounts(liveData);
            state.syncStatus = "Synchronisé en direct avec le Mac (4G/5G)";
            state.isRefreshing = false;
            render();
            return;
          }
        }
      } catch {}

      // 2. Otherwise refresh live BTC / WBTC / ETH / BNB / USDC prices in EUR directly from CoinGecko
      try {
        const cgRes = await fetch("https://api.coingecko.com/api/v3/simple/price?ids=bitcoin,wrapped-bitcoin,ethereum,usd-coin,binancecoin,matic-network&vs_currencies=eur,usd&include_24hr_change=true");
        if (cgRes.ok) {
          const prices = await cgRes.json();
          const mapId = {
            BTC: "bitcoin",
            aWBTC: "wrapped-bitcoin",
            WBTC: "wrapped-bitcoin",
            ETH: "ethereum",
            WETH: "ethereum",
            USDC: "usd-coin",
            "USDC.e": "usd-coin",
            debtUSDC: "usd-coin",
            BNB: "binancecoin",
            POL: "matic-network",
          };
          for (const h of state.data.cryptoHoldings || []) {
            const cgKey = mapId[h.symbol];
            if (cgKey && prices[cgKey] && prices[cgKey].eur) {
              h.priceEur = prices[cgKey].eur;
              h.priceUsd = prices[cgKey].usd || h.priceUsd;
              h.change24hPct = prices[cgKey].eur_24h_change || h.change24hPct;
              h.valueEur = h.balance * h.priceEur;
            }
          }
          recomputeTotals(state.data);
          state.syncStatus = "Cours Crypto EUR actualisés en direct (4G/5G)";
        }
      } catch {
        state.syncStatus = "Mode Coffre Autonome (4G/5G)";
      }
      state.isRefreshing = false;
      render();
    }

      if (state.hideAmounts) return "••••••,•• €";

    async function handlePinInput(digit) {
      if (state.pin.length >= 4) return;
      state.pinError = false;
      state.pin += digit;
      render();

      if (state.pin.length === 4) {
        const decrypted = await decryptVaultWithPin(state.pin);
        if (decrypted) {
          state.data = loadLocalBankAccounts(decrypted);
          state.unlocked = true;
          if (state.rememberDevice) {
            localStorage.setItem("patrimoine_os_pin_v1", state.pin);
          }
          render();
          refreshLiveMarketPrices();
        } else {
          state.pinError = true;
          render();
          setTimeout(() => {
            state.pin = "";
            state.pinError = false;
            render();
          }, 500);
        }
      }
    }

      e.preventDefault();

      const bal = parseFloat(String(state.newBankBalance).replace(",", "."));
      if (isNaN(bal)) return;
      const banks = state.data.bankAccounts || [];
      const existingIdx = banks.findIndex(b => b.name.toLowerCase() === state.newBankName.toLowerCase());
      const item = {
        id: existingIdx >= 0 ? banks[existingIdx].id : "cm-" + Date.now(),
        institution: "Crédit Mutuel",
        name: state.newBankName,
        type: state.newBankType,
        ibanMasked: "FR76 •••• •••• •••• (Masqué)",
        balanceEur: bal,
        lastSync: new Date().toISOString(),
        source: "manual"
      };
      if (existingIdx >= 0) banks[existingIdx] = item;
      else banks.push(item);
      state.data.bankAccounts = banks;
      localStorage.setItem("patrimoine_os_local_banks_v1", JSON.stringify(banks));
      state.newBankBalance = "";
      recomputeTotals(state.data);
      render();
    }

          </div>

          <div class="lg:col-span-7 glass-card rounded-2xl p-6">
            <div class="flex items-center justify-between mb-4">
              <h3 class="font-bold text-white text-base">Comptes Crédit Mutuel suivis</h3>
              <span class="text-lg font-extrabold text-blue-400">${formatEurPrecise(d.totals.bankTotalEur)}</span>
            </div>
            ${(d.bankAccounts || []).length === 0 ? `
              <div class="text-center py-12 text-slate-400 text-sm">
                Aucun compte Crédit Mutuel enregistré. Utilisez le formulaire ci-contre pour ajouter votre Eurocompte ou Livret Bleu.
              </div>
            ` : `
              <div class="space-y-3">
                ${(d.bankAccounts || []).map(acc => `
                  <div class="flex items-center justify-between p-4 rounded-xl bg-slate-900/70 border border-slate-800">
                    <div>
                      <div class="font-bold text-white text-sm">${acc.name}</div>
                      <div class="text-xs text-slate-400">${acc.ibanMasked}</div>
                    </div>
                    <div class="flex items-center gap-3">
                      <span class="text-base font-extrabold text-white">${formatEurPrecise(acc.balanceEur)}</span>
                      <button onclick="deleteBankAccount('${acc.id}')" class="text-xs text-rose-400 hover:text-rose-300 px-2 py-1 rounded bg-rose-500/10">Supprimer</button>
                    </div>
                  </div>
                `).join("")}
              </div>
            `}
          </div>
        </div>
      `;
    }

    function renderCryptoTab(d) {
      const wallets = d.cryptoWallets || [];
      const walletMap = {};
      wallets.forEach(w => walletMap[w.id] = w);

      const holdings = (d.cryptoHoldings || []).filter(h => {
        const w = walletMap[h.walletId];
        if (state.cryptoDeviceFilter !== "all" && (!w || w.device !== state.cryptoDeviceFilter)) return false;
        if (state.cryptoChainFilter !== "all" && h.chain !== state.cryptoChainFilter) return false;
        return true;
      });

      return `
        <div class="space-y-6">
          <div class="grid grid-cols-1 sm:grid-cols-3 gap-4">
            ${wallets.map(w => `
              <div class="glass-card rounded-2xl p-5 border border-slate-800">
                <div class="flex items-center justify-between">
                  <span class="text-xs font-bold uppercase px-2.5 py-0.5 rounded-full ${w.device === 'ledger' ? 'bg-emerald-500/15 text-emerald-300 border border-emerald-500/30' : 'bg-orange-500/15 text-orange-300 border border-orange-500/30'}">
                    ${w.device === 'ledger' ? '🛡️ Ledger Cold Storage' : '🦊 MetaMask + Aave V3'}
                  </span>
                </div>
                <div class="font-bold text-white text-sm mt-3">${w.label}</div>
                <div class="text-xs text-slate-400 font-mono mt-0.5">${w.address}</div>
                <div class="text-xl font-extrabold text-indigo-300 mt-3">${formatEurPrecise(w.totalValueEur)}</div>
              </div>
            `).join("")}
          </div>

          <div class="glass-card rounded-2xl p-6">
            <div class="flex flex-wrap items-center justify-between gap-3 mb-5">
              <div class="flex items-center gap-2">
                ${[
                  { id: "all", label: "Tous" },
                  { id: "ledger", label: "Ledger (BTC)" },
                  { id: "metamask", label: "MetaMask (EVM & Aave)" }
                ].map(f => `
                  <button onclick="state.cryptoDeviceFilter='${f.id}';render();" class="px-3 py-1.5 rounded-xl text-xs font-semibold transition ${state.cryptoDeviceFilter === f.id ? 'bg-indigo-600 text-white' : 'bg-slate-900 text-slate-400 hover:text-white border border-slate-800'}">
                    ${f.label}
                  </button>
                `).join("")}
              </div>
              <div class="text-sm font-bold text-white">
                Total filtré : <span class="text-indigo-400">${formatEurPrecise(holdings.reduce((s,h)=>s+h.valueEur,0))}</span>
              </div>
            </div>

            <div class="space-y-2.5">
              ${holdings.map(h => {
                const ch = CHAIN_LABELS[h.chain] || { label: h.chain, badge: "bg-slate-800 text-slate-300" };
                const w = walletMap[h.walletId];
                const isDebt = h.balance < 0 || h.valueEur < 0;
                return `
                  <div class="flex items-center justify-between p-3.5 rounded-xl bg-slate-900/70 border border-slate-800/90">
                    <div class="min-w-0 pr-3">
                      <div class="flex items-center gap-2 flex-wrap">
                        <span class="font-bold text-white text-sm">${h.symbol}</span>
                        <span class="text-xs text-slate-300">${h.name}</span>
                        <span class="text-[10px] px-2 py-0.5 rounded-full border ${ch.badge}">${ch.label}</span>
                        ${w ? `<span class="text-[10px] px-2 py-0.5 rounded-full bg-slate-800 text-slate-300">${w.label}</span>` : ''}
                      </div>
                      <div class="text-xs text-slate-400 mt-1">
                        Quantité : <span class="text-slate-200 font-mono">${h.balance.toFixed(6)} ${h.symbol}</span> · Prix : ${formatEur(h.priceEur)}
                      </div>
                    </div>
                    <div class="text-right shrink-0">
                      <div class="text-base font-extrabold ${isDebt ? 'text-rose-400' : 'text-white'}">${formatEurPrecise(h.valueEur)}</div>
                    </div>
                  </div>
                `;
              }).join("")}
            </div>
          </div>
        </div>
      `;
    }

    function renderPokemonTab(d) {
      const allItems = d.pokemonItems || [];
      const totalCount = allItems.reduce((s, i) => s + i.quantity, 0);
      const gradedCount = allItems.filter(i => !i.isSealed && !String(i.condition).toLowerCase().includes("non gradé")).reduce((s, i) => s + i.quantity, 0);
      const ungradedCount = allItems.filter(i => !i.isSealed && String(i.condition).toLowerCase().includes("non gradé")).reduce((s, i) => s + i.quantity, 0);
      const sealedCount = allItems.filter(i => i.isSealed).reduce((s, i) => s + i.quantity, 0);

      const items = allItems.filter(item => {
        const isUngraded = !item.isSealed && String(item.condition).toLowerCase().includes("non gradé");
        if (state.pokemonFilter === "graded" && (item.isSealed || isUngraded)) return false;
        if (state.pokemonFilter === "ungraded" && !isUngraded) return false;
        if (state.pokemonFilter === "sealed" && !item.isSealed) return false;
        if (state.pokemonSearch.trim()) {
          const q = state.pokemonSearch.toLowerCase();
          return item.name.toLowerCase().includes(q) || item.setName.toLowerCase().includes(q) || item.condition.toLowerCase().includes(q);
        }
        return true;
      });

      return `
        <div class="space-y-5">
          <div class="glass-card rounded-2xl p-5 flex flex-wrap items-center justify-between gap-4">
            <div class="flex flex-wrap items-center gap-2">
              ${[
                { id: "all", label: "Tout (" + totalCount + ")" },
                { id: "graded", label: "Gradées PSA/CGC (" + gradedCount + ")" },
                { id: "ungraded", label: "Non Gradées (" + ungradedCount + ")" },
                { id: "sealed", label: "Scellés (" + sealedCount + ")" }
              ].map(f => `
                <button onclick="state.pokemonFilter='${f.id}';render();" class="px-3 py-1.5 rounded-xl text-xs font-semibold transition ${state.pokemonFilter === f.id ? 'bg-amber-500 text-slate-950' : 'bg-slate-900 text-slate-400 hover:text-white border border-slate-800'}">
                  ${f.label}
                </button>
              `).join("")}
            </div>

            <div class="flex items-center gap-3 flex-1 sm:flex-initial justify-end">
              <input
                type="search"
                placeholder="Rechercher carte, extension, PSA 10, NM..."
                value="${state.pokemonSearch}"
                oninput="state.pokemonSearch=this.value;render();"
                class="w-full sm:w-64 px-3.5 py-1.5 rounded-xl bg-slate-900 border border-slate-800 text-xs text-white focus:outline-none focus:border-amber-500"
              />
              <div class="text-sm font-extrabold text-amber-400 shrink-0">
                ${formatEurPrecise(items.reduce((s,i)=>s+i.totalValueEur,0))}
              </div>
            </div>
          </div>

          <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4">
            ${items.map(item => {
              const isUngraded = !item.isSealed && String(item.condition).toLowerCase().includes("non gradé");
              const badgeCls = item.isSealed
                ? "bg-purple-500/20 text-purple-300 border border-purple-500/30"
                : isUngraded
                ? "bg-sky-500/20 text-sky-300 border border-sky-500/30"
                : "bg-amber-500/20 text-amber-300 border border-amber-500/30";
              return `
              <div class="glass-card rounded-2xl p-4 flex gap-3.5 items-center border border-slate-800/90 hover:border-amber-500/40 transition">
                <img src="${item.imageUrl}" alt="" loading="lazy" class="w-16 h-22 object-contain rounded-lg bg-slate-950 p-1 shrink-0" />
                <div class="min-w-0 flex-1">
                  <div class="flex items-center gap-1.5 flex-wrap">
                    <span class="text-[10px] font-bold px-2 py-0.5 rounded-md ${badgeCls}">
                      ${item.condition}
                    </span>
                    ${item.cardNumber ? `<span class="text-[10px] text-slate-400">#${item.cardNumber}</span>` : ''}
                  </div>
                  <div class="font-bold text-white text-sm truncate mt-1" title="${item.name}">${item.name}</div>
                  <div class="text-xs text-slate-400 truncate">${item.setName}</div>
                  <div class="flex items-center justify-between mt-2.5 pt-2 border-t border-slate-800/80">
                    <span class="text-[11px] text-slate-400">Qté: ${item.quantity}</span>
                    <span class="text-sm font-extrabold text-amber-300">${formatEurPrecise(item.totalValueEur)}</span>
                  </div>
                </div>
              </div>
              `;
            }).join("")}
          </div>
        </div>
      `;
    }

    function render() {
      const root = document.getElementById("app");
      if (!state.unlocked || !state.data) {
        root.innerHTML = renderLockScreen();
        return;
      }

      const d = state.data;
      let content = "";
      if (state.activeTab === "overview") content = renderOverviewTab(d);
      else if (state.activeTab === "bank") content = renderBankTab(d);
      else if (state.activeTab === "crypto") content = renderCryptoTab(d);
      else if (state.activeTab === "pokemon") content = renderPokemonTab(d);

      root.innerHTML = `
        <div class="min-h-screen flex flex-col">
          <header class="sticky top-0 z-30 border-b border-slate-800/80 bg-[#07090e]/90 backdrop-blur-xl">
            <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between gap-3">
              <div class="flex items-center gap-3">
                <a href="../" class="text-xs text-slate-400 hover:text-white px-2.5 py-1.5 rounded-xl bg-slate-900 border border-slate-800">
                  ← Tapp Store
                </a>
                <div>
                  <div class="flex items-center gap-2">
                    <h1 class="font-bold text-base sm:text-lg tracking-tight text-white">
                      Patrimoine<span class="text-indigo-400">OS</span>
                    </h1>
                    <span class="hidden md:inline-flex items-center gap-1 px-2 py-0.5 rounded-full text-[11px] font-medium bg-emerald-950/90 text-emerald-300 border border-emerald-500/30">
                      🔒 Coffre PIN Chiffré
                    </span>
                  </div>
                </div>
              </div>

              <div class="flex items-center gap-2 overflow-x-auto">
                <button onclick="refreshLiveMarketPrices()" class="px-3 py-1.5 rounded-xl border border-indigo-500/30 bg-indigo-500/10 text-indigo-300 hover:bg-indigo-500/20 text-xs font-medium transition shrink-0">
                  ${state.isRefreshing ? "⏳ Sync..." : "🔄 Actualiser 4G/5G"}
                </button>
                <button onclick="state.hideAmounts=!state.hideAmounts;render();" class="px-3 py-1.5 rounded-xl border border-slate-800 bg-slate-900 text-slate-300 hover:text-white text-xs font-medium transition shrink-0">
                  ${state.hideAmounts ? "🙈 Masqué" : "👁️ Discret"}
                </button>
                <button onclick="lockVault()" class="px-3 py-1.5 rounded-xl border border-rose-500/30 bg-rose-500/10 text-rose-300 hover:bg-rose-500/20 text-xs font-medium transition shrink-0">
                  🔒 Verrouiller
                </button>
              </div>
            </div>

            <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 pb-2.5 flex items-center gap-1.5 overflow-x-auto">
              ${[
                { id: "overview", label: "📊 Vue Globale" },
                { id: "bank", label: "🏦 Crédit Mutuel" },
                { id: "crypto", label: "⛓️ MetaMask & Ledger" },
                { id: "pokemon", label: "✨ Pokémon Collectr" }
              ].map(tab => `
                <button onclick="state.activeTab='${tab.id}';render();" class="px-3.5 py-1.5 rounded-xl text-xs font-semibold transition shrink-0 ${state.activeTab === tab.id ? 'bg-indigo-600 text-white shadow-sm' : 'bg-slate-900/90 text-slate-400 hover:text-white border border-slate-800'}">
                  ${tab.label}
                </button>
              `).join("")}
            </div>
          </header>

          <main class="flex-1 max-w-7xl w-full mx-auto px-4 sm:px-6 lg:px-8 py-6">
            ${content}
          </main>
        </div>
      `;
    }

    // Auto-unlock if saved on device
    (async () => {
      const savedPin = localStorage.getItem("patrimoine_os_pin_v1");
      if (savedPin && savedPin.length === 4) {
        const decrypted = await decryptVaultWithPin(savedPin);
        if (decrypted) {
          state.data = loadLocalBankAccounts(decrypted);
          state.unlocked = true;
          render();
          refreshLiveMarketPrices();
          return;
        }
      }
      render();
    })();
  </script>
</body>
</html>
