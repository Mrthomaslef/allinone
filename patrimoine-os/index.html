    function base64ToUint8Array(b64) {
      const bin = atob(b64);
      const arr = new Uint8Array(bin.length);
      for (let i = 0; i < bin.length; i++) arr[i] = bin.charCodeAt(i);
      return arr;
    }

    async function decryptVaultWithPin(pinCode) {
      try {
        const enc = new TextEncoder();
        const keyMaterial = await window.crypto.subtle.importKey(
          "raw",
          enc.encode(pinCode),
          { name: "PBKDF2" },
          false,
          ["deriveKey"]
        );
        const salt = base64ToUint8Array(ENCRYPTED_VAULT.salt);
        const iv = base64ToUint8Array(ENCRYPTED_VAULT.iv);
        const ct = base64ToUint8Array(ENCRYPTED_VAULT.ct);

        const aesKey = await window.crypto.subtle.deriveKey(
          {
            name: "PBKDF2",
            salt,
            iterations: ENCRYPTED_VAULT.iterations,
            hash: "SHA-256",
          },
          keyMaterial,
          { name: "AES-GCM", length: 256 },
          false,
          ["decrypt"]
        );

        const decryptedBuf = await window.crypto.subtle.decrypt(
          { name: "AES-GCM", iv },
          aesKey,
          ct
        );
        const jsonStr = new TextDecoder().decode(decryptedBuf);
        return JSON.parse(jsonStr);
      } catch (e) {
        return null;
      }
    }

    function loadLocalBankAccounts(baseData) {
      try {
        const saved = localStorage.getItem("patrimoine_os_local_banks_v1");
        if (saved) {
          const parsed = JSON.parse(saved);
          if (Array.isArray(parsed)) {
            baseData.bankAccounts = parsed;
          }
        }
      } catch {}
      recomputeTotals(baseData);
      return baseData;
    }

    function recomputeTotals(d) {
      if (!d) return;
      const bankTotal = (d.bankAccounts || []).reduce((acc, b) => acc + (Number(b.balanceEur) || 0), 0);
      const cryptoTotal = (d.cryptoHoldings || []).reduce((acc, h) => acc + (Number(h.valueEur) || 0), 0);
      const pokemonTotal = (d.pokemonItems || []).reduce((acc, p) => acc + (Number(p.totalValueEur) || 0), 0);
      const total = bankTotal + cryptoTotal + pokemonTotal;
      d.totals = {
        totalNetWorthEur: total,
        bankTotalEur: bankTotal,
        cryptoTotalEur: cryptoTotal,
        pokemonTotalEur: pokemonTotal,
        allocationPct: {
          bank: total > 0 ? (bankTotal / total) * 100 : 0,
          crypto: total > 0 ? (cryptoTotal / total) * 100 : 0,
          pokemon: total > 0 ? (pokemonTotal / total) * 100 : 0,
        }
      };
      for (const w of d.cryptoWallets || []) {
        w.totalValueEur = (d.cryptoHoldings || [])
          .filter(h => h.walletId === w.id)
          .reduce((s, h) => s + (Number(h.valueEur) || 0), 0);
      }
    }

    async function refreshLiveMarketPrices() {
      if (!state.data || state.isRefreshing) return;
      state.isRefreshing = true;
      state.syncStatus = "Actualisation des cours live...";
      render();

      // 1. Try syncing from live Mac tunnel if online
      try {
        const ctrl = new AbortController();
        const timer = setTimeout(() => ctrl.abort(), 3500);
        const res = await fetch(LIVE_TUNNEL_URL + "/api/portfolio", { signal: ctrl.signal });
        clearTimeout(timer);
        if (res.ok) {
          const liveData = await res.json();
          if (liveData && liveData.totals) {
            const keepPlan = state.data && state.data.btcPlan;
            state.data = loadLocalBankAccounts(liveData);
            if (keepPlan && !state.data.btcPlan) state.data.btcPlan = keepPlan;
            state.syncStatus = "Synchronisé en direct avec le Mac (4G/5G)";
            state.isRefreshing = false;
            render();
            return;
          }
        }
      } catch {}

      // 2. Otherwise refresh live BTC / WBTC / ETH / BNB / USDC prices in EUR directly from CoinGecko
      try {
        const cgRes = await fetch("https://api.coingecko.com/api/v3/simple/price?ids=bitcoin,wrapped-bitcoin,ethereum,usd-coin,binancecoin,matic-network&vs_currencies=eur,usd&include_24hr_change=true");
        if (cgRes.ok) {
          const prices = await cgRes.json();
          const mapId = {
            BTC: "bitcoin",
            aWBTC: "wrapped-bitcoin",
            WBTC: "wrapped-bitcoin",
            ETH: "ethereum",
            WETH: "ethereum",
            USDC: "usd-coin",
            "USDC.e": "usd-coin",
            debtUSDC: "usd-coin",
            BNB: "binancecoin",
            POL: "matic-network",
          };
          for (const h of state.data.cryptoHoldings || []) {
            const cgKey = mapId[h.symbol];
            if (cgKey && prices[cgKey] && prices[cgKey].eur) {
              h.priceEur = prices[cgKey].eur;
              h.priceUsd = prices[cgKey].usd || h.priceUsd;
              h.change24hPct = prices[cgKey].eur_24h_change || h.change24hPct;
              h.valueEur = h.balance * h.priceEur;
            }
          }
          recomputeTotals(state.data);
          state.syncStatus = "Cours Crypto EUR actualisés en direct (4G/5G)";
        }
      } catch {
        state.syncStatus = "Mode Coffre Autonome (4G/5G)";
      }
      state.isRefreshing = false;
      render();
    }

    function formatEur(val) {
      if (state.hideAmounts) return "•••• €";
      const n = Number(val) || 0;
      return new Intl.NumberFormat("fr-FR", {
        style: "currency",
        currency: "EUR",
        maximumFractionDigits: Math.abs(n) >= 1000 ? 0 : 2,
      }).format(n);
    }

    function formatEurPrecise(val) {
      if (state.hideAmounts) return "••••••,•• €";
      const n = Number(val) || 0;
      return new Intl.NumberFormat("fr-FR", {
        style: "currency",
        currency: "EUR",
        minimumFractionDigits: 2,
        maximumFractionDigits: 2,
      }).format(n);
    }

    async function handlePinInput(digit) {
      if (state.pin.length >= 4) return;
      state.pinError = false;
      state.pin += digit;
      render();

      if (state.pin.length === 4) {
        const decrypted = await decryptVaultWithPin(state.pin);
        if (decrypted) {
          state.data = loadLocalBankAccounts(decrypted);
          state.unlocked = true;
          if (state.rememberDevice) {
            localStorage.setItem("patrimoine_os_pin_v1", state.pin);
          }
          render();
          refreshLiveMarketPrices();
          fetchBtcPlanLive();
        } else {
          state.pinError = true;
          render();
          setTimeout(() => {
            state.pin = "";
            state.pinError = false;
            render();
          }, 500);
        }
      }
    }

    function handleBackspace() {
      state.pinError = false;
      state.pin = state.pin.slice(0, -1);
      render();
    }

    function lockVault() {
      localStorage.removeItem("patrimoine_os_pin_v1");
      state.unlocked = false;
      state.pin = "";
      state.data = null;
      render();
    }

    function addOrUpdateBankAccount(e) {
      e.preventDefault();
      if (!state.newBankName || state.newBankBalance === "") return;
      const bal = parseFloat(String(state.newBankBalance).replace(",", "."));
      if (isNaN(bal)) return;

// Dépend des globales de la page : state, render, recomputeTotals, formatEur.
const BTC_PLAN_LS = "patrimoine_os_btc_plan_v1";
const btcLive = { loading: false, error: "", at: null, btcUsd: null, btcEur: null, collatUsd: null, debtUsd: null, hf: null, lt: null };

function planChecks() {
  try { return JSON.parse(localStorage.getItem(BTC_PLAN_LS) || "{}"); } catch { return {}; }
}
function togglePlanCheck(key) {
  const c = planChecks();
  c[key] = !c[key];
  localStorage.setItem(BTC_PLAN_LS, JSON.stringify(c));
  if (navigator.vibrate) navigator.vibrate(10);
  render();
}
function fmtUsd(v, digits = 0) {
  if (state.hideAmounts) return "•••• $";
  if (v == null || !isFinite(v)) return "—";
  return new Intl.NumberFormat("fr-FR", { style: "currency", currency: "USD", maximumFractionDigits: digits }).format(v);
}
function fmtNum(v, d = 2) {
  if (v == null || !isFinite(v)) return "—";
  return new Intl.NumberFormat("fr-FR", { minimumFractionDigits: d, maximumFractionDigits: d }).format(v);
}
function fmtDateFr(iso) {
  const [y, m, d] = iso.split("-").map(Number);
  return new Date(y, m - 1, d).toLocaleDateString("fr-FR", { weekday: "short", day: "2-digit", month: "short" });
}
function todayIso() {
  const n = new Date();
  return new Date(n.getTime() - n.getTimezoneOffset() * 60000).toISOString().slice(0, 10);
}

async function fetchBtcPlanLive() {
  const plan = state.data && state.data.btcPlan;
  if (!plan || btcLive.loading) return;
  btcLive.loading = true; btcLive.error = "";
  if (state.activeTab === "btcplan") render();
  try {
    const addr = String(plan.aave.address || "").toLowerCase().replace(/^0x/, "");
    const call = fetch(plan.aave.rpc, {
      method: "POST", headers: { "content-type": "application/json" },
      body: JSON.stringify({ jsonrpc: "2.0", id: 1, method: "eth_call", params: [{ to: plan.aave.pool, data: "0xbf92857c" + addr.padStart(64, "0") }, "latest"] }),
    }).then(r => r.json());
    const price = fetch("https://api.coingecko.com/api/v3/simple/price?ids=bitcoin&vs_currencies=usd,eur").then(r => r.json());
    const [rpc, cg] = await Promise.all([call, price]);
    const hex = String(rpc.result || "").slice(2);
    if (hex.length < 64 * 6) throw new Error("Réponse Aave invalide");
    const w = i => BigInt("0x" + hex.slice(i * 64, i * 64 + 64));
    btcLive.collatUsd = Number(w(0)) / 1e8;
    btcLive.debtUsd = Number(w(1)) / 1e8;
    btcLive.lt = Number(w(3)) / 1e4;
    const hfRaw = w(5);
    btcLive.hf = hfRaw > 10n ** 30n ? Infinity : Number(hfRaw) / 1e18;
    btcLive.btcUsd = cg.bitcoin.usd; btcLive.btcEur = cg.bitcoin.eur;
    btcLive.at = new Date();
    syncAaveHoldings();
  } catch (e) {
    btcLive.error = "Lecture live impossible (" + (e.message || "réseau") + ")";
  }
  btcLive.loading = false;
  render();
}

// Remet les lignes aWBTC / dette USDC de l'onglet crypto à jour avec la lecture on-chain.
function syncAaveHoldings() {
  const d = state.data;
  if (!d || !btcLive.btcUsd) return;
  const fx = btcLive.btcEur / btcLive.btcUsd;
  for (const h of d.cryptoHoldings || []) {
    if (h.symbol === "aWBTC") {
      h.balance = btcLive.collatUsd / btcLive.btcUsd;
      h.priceEur = btcLive.btcEur;
      h.valueEur = btcLive.collatUsd * fx;
      h.name = "Aave V3 WBTC (Collatéral · HF " + fmtNum(btcLive.hf, 2) + ")";
    } else if (h.symbol === "debtUSDC") {
      h.balance = -btcLive.debtUsd;
      h.priceEur = fx;
      h.valueEur = -btcLive.debtUsd * fx;
    }
  }
  recomputeTotals(d);
}

function hfColor(hf) {
  if (hf == null) return "text-slate-300";
  if (hf >= 2.5) return "text-emerald-300";
  if (hf >= 1.8) return "text-lime-300";
  if (hf >= 1.5) return "text-amber-300";
  return "text-rose-400";
}

            const isCur = current && s.date === current.date;
            const pill = (k, txt) => `<button onclick="togglePlanCheck('${k}')" class="px-2 py-1 rounded-lg text-[11px] font-semibold border ${checks[k] ? "bg-emerald-500/20 border-emerald-500/40 text-emerald-200" : "bg-slate-900 border-slate-700 text-slate-300"}">${checks[k] ? "✓ " : ""}${txt}</button>`;
            return `<div class="flex items-center justify-between gap-2 p-2.5 rounded-xl ${isCur ? "bg-indigo-950/60 border border-indigo-500/40" : "bg-slate-900/50"}">
              <span class="text-xs font-semibold ${s.date < today && !stepDone(s) ? "text-amber-300" : "text-slate-200"} w-20 shrink-0">${fmtDateFr(s.date)}</span>
              <span class="flex flex-wrap justify-end gap-1">${pill(s.kR, "Rev " + (s.revolutEur / 1000) + " k€")}${pill(s.kA, "Aave " + (s.aaveUsd / 1000) + " k$")}${s.ledgerWithdrawEur ? pill(s.kL, "→ Ledger") : ""}</span>
            </div>`;
          }).join("")}
        </div>
      </div>

      <div class="glass-card rounded-2xl p-5 space-y-2">
        <h2 class="text-base font-bold text-white">🛡️ Règles à ne jamais enfreindre</h2>

      <div class="glass-card rounded-2xl p-5 space-y-2">
        <h2 class="text-base font-bold text-white">🩺 Phase 2 : à partir des remplacements</h2>

      </div>

      <p class="text-[11px] text-slate-500 text-center pb-4">Prix de liquidation estimé (collatéral 100 % BTC). Ce n'est pas un conseil financier.</p>
    </div>`;
}

// Pull-to-refresh tactile uniquement (iPhone/iPad), indicateur ↻ discret.
(function setupPullToRefresh() {
  if (!window.matchMedia("(hover: none) and (pointer: coarse)").matches) return;
  const ind = document.createElement("div");
  ind.id = "ptr-ind";
  ind.innerHTML = '<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#a5b4fc" stroke-width="2.4" stroke-linecap="round"><path d="M20 12a8 8 0 1 1-2.34-5.66"/><path d="M20 4v5h-5"/></svg>';
  document.body.appendChild(ind);
  let y0 = null, dy = 0;
  window.addEventListener("touchstart", e => { y0 = window.scrollY <= 0 ? e.touches[0].clientY : null; dy = 0; }, { passive: true });
  window.addEventListener("touchmove", e => {
    if (y0 == null) return;
    dy = Math.max(0, e.touches[0].clientY - y0);
    ind.style.opacity = Math.min(1, dy / 80);
    ind.style.transform = `translateX(-50%) translateY(${Math.min(dy, 90) / 2}px) rotate(${dy * 3}deg)`;
  }, { passive: true });
  window.addEventListener("touchend", () => {
    if (dy > 80 && state.unlocked) {
      if (navigator.vibrate) navigator.vibrate(12);
      ind.classList.add("spin");
      Promise.all([refreshLiveMarketPrices(), fetchBtcPlanLive()]).finally(() => { ind.classList.remove("spin"); ind.style.opacity = 0; });
    } else ind.style.opacity = 0;
    y0 = null; dy = 0;
  });
})();
