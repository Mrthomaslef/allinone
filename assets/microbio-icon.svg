    </linearGradient>
    <radialGradient id="dish" cx=".45" cy=".4" r=".7">
      <stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#e6f4f2"/>
    </radialGradient>
  </defs>
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <!-- boîte de Pétri -->
