    <rect x="160" y="296" width="54" height="22" rx="11" transform="rotate(-25 187 307)"/>
    <rect x="206" y="340" width="46" height="20" rx="10" transform="rotate(18 229 350)"/>
    <circle cx="352" cy="282" r="9"/><circle cx="370" cy="300" r="9"/><circle cx="352" cy="318" r="9"/>
