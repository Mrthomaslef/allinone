<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#312e81"/>
      <stop offset="1" stop-color="#0f766e"/>
    </linearGradient>
    <linearGradient id="bone" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#e7e5f5"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <!-- portée -->
  <g stroke="#ffffff" stroke-opacity=".22" stroke-width="7">
    <line x1="40" y1="176" x2="472" y2="176"/>
    <line x1="40" y1="224" x2="472" y2="224"/>
    <line x1="40" y1="272" x2="472" y2="272"/>
    <line x1="40" y1="320" x2="472" y2="320"/>
    <line x1="40" y1="368" x2="472" y2="368"/>
  </g>
  <!-- note double croche dont les hampes sont des os -->
  <g fill="url(#bone)">
    <!-- hampe-os gauche -->
    <rect x="196" y="128" width="26" height="236" rx="10"/>
    <circle cx="196" cy="128" r="20"/><circle cx="222" cy="128" r="20"/>
    <!-- hampe-os droite -->
    <rect x="356" y="100" width="26" height="236" rx="10"/>
    <circle cx="356" cy="100" r="20"/><circle cx="382" cy="100" r="20"/>
    <!-- barre de ligature -->
    <path d="M196 132 L382 104 L382 146 L196 174 Z"/>
    <!-- têtes de note -->
    <ellipse cx="166" cy="372" rx="58" ry="42" transform="rotate(-22 166 372)"/>
    <ellipse cx="326" cy="344" rx="58" ry="42" transform="rotate(-22 326 344)"/>
  </g>
  <ellipse cx="166" cy="372" rx="22" ry="13" transform="rotate(-22 166 372)" fill="#2dd4bf" opacity=".55"/>
  <ellipse cx="326" cy="344" rx="22" ry="13" transform="rotate(-22 326 344)" fill="#2dd4bf" opacity=".55"/>
</svg>
