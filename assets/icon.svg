<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#090D1A"/>
      <stop offset="50%" stop-color="#11182E"/>
      <stop offset="100%" stop-color="#1A1238"/>
    </linearGradient>
    <linearGradient id="prismCyan" x1="80" y1="80" x2="432" y2="432" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#22D3EE"/>
      <stop offset="50%" stop-color="#10B981"/>
      <stop offset="100%" stop-color="#8B5CF6"/>
    </linearGradient>
    <linearGradient id="prismViolet" x1="432" y1="80" x2="80" y2="432" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#A855F7"/>
      <stop offset="50%" stop-color="#3B82F6"/>
      <stop offset="100%" stop-color="#06B6D4"/>
    </linearGradient>
    <radialGradient id="glow" cx="256" cy="256" r="210" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#06B6D4" stop-opacity="0.38"/>
      <stop offset="55%" stop-color="#8B5CF6" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#090D1A" stop-opacity="0"/>
    </radialGradient>
    <filter id="neon" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Squircle App Base -->
  <rect width="512" height="512" rx="116" fill="url(#bg)"/>
  <rect x="8" y="8" width="496" height="496" rx="108" stroke="url(#prismCyan)" stroke-opacity="0.28" stroke-width="3"/>

  <!-- Ambient Core Glow -->
  <circle cx="256" cy="256" r="210" fill="url(#glow)"/>

  <!-- Outer Isometric Hexagon -->
  <g filter="url(#neon)">
    <polygon points="256,68 418,162 418,350 256,444 94,350 94,162" fill="#0F172A" fill-opacity="0.45" stroke="url(#prismCyan)" stroke-width="8" stroke-linejoin="round"/>

    <!-- Inner Star / Prism Facets -->
    <polygon points="256,68 337,209 418,350 256,304 94,350 175,209" fill="url(#prismCyan)" fill-opacity="0.16" stroke="url(#prismCyan)" stroke-width="5" stroke-linejoin="round"/>
    <polygon points="418,162 337,303 256,444 175,303 94,162 256,208" fill="url(#prismViolet)" fill-opacity="0.16" stroke="url(#prismViolet)" stroke-width="5" stroke-linejoin="round"/>

    <!-- Precision Axes -->
    <line x1="256" y1="68" x2="256" y2="212" stroke="#22D3EE" stroke-width="6" stroke-linecap="round"/>
    <line x1="256" y1="300" x2="256" y2="444" stroke="#10B981" stroke-width="6" stroke-linecap="round"/>
    <line x1="94" y1="162" x2="218" y2="234" stroke="#38BDF8" stroke-width="5" stroke-linecap="round"/>
    <line x1="294" y1="278" x2="418" y2="350" stroke="#A855F7" stroke-width="5" stroke-linecap="round"/>
    <line x1="418" y1="162" x2="294" y2="234" stroke="#C084FC" stroke-width="5" stroke-linecap="round"/>
    <line x1="218" y1="278" x2="94" y2="350" stroke="#2DD4BF" stroke-width="5" stroke-linecap="round"/>

    <!-- Central Nexus Core -->
    <circle cx="256" cy="256" r="44" fill="#090D1A" stroke="url(#prismCyan)" stroke-width="6"/>
    <circle cx="256" cy="256" r="22" fill="url(#prismCyan)"/>
    <circle cx="249" cy="249" r="6" fill="#FFFFFF" fill-opacity="0.9"/>
  </g>
</svg>
