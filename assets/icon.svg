<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#140B2E"/>
      <stop offset="50%" stop-color="#1E1145"/>
      <stop offset="100%" stop-color="#0D1B3E"/>
    </linearGradient>
    <radialGradient id="aura" cx="256" cy="270" r="220" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#EC4899" stop-opacity="0.5"/>
      <stop offset="50%" stop-color="#8B5CF6" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#140B2E" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="bagBody" x1="110" y1="150" x2="402" y2="440" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="35%" stop-color="#8B5CF6"/>
      <stop offset="75%" stop-color="#EC4899"/>
      <stop offset="100%" stop-color="#F97316"/>
    </linearGradient>
    <linearGradient id="handleBack" x1="180" y1="70" x2="310" y2="190" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#60A5FA"/>
      <stop offset="100%" stop-color="#8B5CF6"/>
    </linearGradient>
    <linearGradient id="handleFront" x1="190" y1="65" x2="330" y2="195" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FDE047"/>
      <stop offset="50%" stop-color="#FB7185"/>
      <stop offset="100%" stop-color="#D946EF"/>
    </linearGradient>
    <linearGradient id="tGrad" x1="190" y1="210" x2="320" y2="390" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FEF08A"/>
      <stop offset="45%" stop-color="#F472B6"/>
      <stop offset="100%" stop-color="#C084FC"/>
    </linearGradient>
    <filter id="shadow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="14" stdDeviation="14" flood-color="#090418" flood-opacity="0.6"/>
    </filter>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Cosmic Squircle Base -->
  <rect width="512" height="512" rx="118" fill="url(#bg)"/>
  <circle cx="256" cy="270" r="220" fill="url(#aura)"/>

  <!-- Floating Sparkles & Stars -->
  <g fill="#FDE047" opacity="0.9">
    <path d="M92 120 L100 138 L118 146 L100 154 L92 172 L84 154 L66 146 L84 138 Z"/>
    <path d="M424 108 L430 122 L444 128 L430 134 L424 148 L418 134 L404 128 L418 122 Z"/>
    <circle cx="430" cy="240" r="7" fill="#38BDF8"/>
    <circle cx="82" cy="310" r="6" fill="#F472B6"/>
    <circle cx="140" cy="90" r="5" fill="#A78BFA"/>
  </g>

  <!-- Back Bag Handle -->
  <path d="M186 175 C186 92, 296 92, 296 175" stroke="url(#handleBack)" stroke-width="26" stroke-linecap="round"/>

  <!-- 3D Shopping Bag Body -->
  <g filter="url(#shadow)">
    <path d="M126 168 C126 150, 140 138, 158 138 L354 138 C372 138, 386 150, 386 168 L406 404 C408 426, 391 444, 368 444 L144 444 C121 444, 104 426, 106 404 Z" fill="url(#bagBody)"/>
    <!-- Glossy Top Highlight -->
    <path d="M136 168 C136 156, 146 148, 158 148 L354 148 C366 148, 376 156, 376 168 L378 195 L134 195 Z" fill="#FFFFFF" fill-opacity="0.18"/>
  </g>

  <!-- Bag Grommets & Front Handle -->
  <circle cx="196" cy="176" r="18" fill="#1E1145"/>
  <circle cx="316" cy="176" r="18" fill="#1E1145"/>
  <path d="M196 176 C196 76, 316 76, 316 176" stroke="url(#handleFront)" stroke-width="28" stroke-linecap="round" filter="url(#shadow)"/>
  <path d="M196 176 C196 76, 316 76, 316 176" stroke="#FFFFFF" stroke-opacity="0.35" stroke-width="8" stroke-linecap="round"/>

  <!-- Glowing Portal Hexagon on Bag -->
  <polygon points="256,192 352,246 352,354 256,408 160,354 160,246" fill="#13092B" fill-opacity="0.78" stroke="#FFFFFF" stroke-opacity="0.85" stroke-width="8" stroke-linejoin="round" filter="url(#glow)"/>
  <polygon points="256,206 338,253 338,347 256,394 174,347 174,253" fill="none" stroke="#38BDF8" stroke-opacity="0.6" stroke-width="4" stroke-linejoin="round"/>

  <!-- Chunky 3D 'T' inside Portal -->
  <g filter="url(#shadow)">
    <!-- 3D Extrusion Depth -->
    <path d="M194 244 H318 V282 H276 V374 H236 V282 H194 Z" fill="#6D28D9" transform="translate(-6, 8)"/>
    <!-- Front Letter T -->
    <path d="M194 244 H318 A12 12 0 0 1 330 256 V270 A12 12 0 0 1 318 282 H276 V362 A12 12 0 0 1 264 374 H248 A12 12 0 0 1 236 362 V282 H194 A12 12 0 0 1 182 270 V256 A12 12 0 0 1 194 244 Z" fill="url(#tGrad)" stroke="#FFFFFF" stroke-width="4"/>
  </g>

  <!-- Mini Floating Gamepad Badge (Top Left) -->
  <g transform="translate(64, 185) rotate(-18)" filter="url(#shadow)">
    <rect x="0" y="0" width="92" height="60" rx="30" fill="#38BDF8" stroke="#FFFFFF" stroke-width="4"/>
    <path d="M28 20 V40 M18 30 H38" stroke="#1E1B4B" stroke-width="7" stroke-linecap="round"/>
    <circle cx="66" cy="23" r="5" fill="#F43F5E"/>
    <circle cx="76" cy="33" r="5" fill="#FACC15"/>
    <circle cx="56" cy="33" r="5" fill="#10B981"/>
  </g>

  <!-- Mini Lightning Bolt (Top Right) -->
  <g transform="translate(370, 145) rotate(12)" filter="url(#shadow)">
    <path d="M36 0 L8 42 H32 L20 80 L64 32 H38 Z" fill="#FACC15" stroke="#FEF08A" stroke-width="3" stroke-linejoin="round"/>
  </g>
</svg>
