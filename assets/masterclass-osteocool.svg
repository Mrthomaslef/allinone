  <!-- 2 électrodes transpédiculaires convergentes -->
  <line x1="22" y1="116" x2="60" y2="48" stroke="#38bdf8" stroke-width="5" stroke-linecap="round"/>
  <line x1="106" y1="116" x2="68" y2="48" stroke="#38bdf8" stroke-width="5" stroke-linecap="round"/>
  <line x1="52" y1="62" x2="60" y2="48" stroke="#f8fafc" stroke-width="5" stroke-linecap="round"/>
  <line x1="76" y1="62" x2="68" y2="48" stroke="#f8fafc" stroke-width="5" stroke-linecap="round"/>
  <!-- flocon = cool -->
  <g stroke="#7dd3fc" stroke-width="3" stroke-linecap="round" transform="translate(104 22)">
    <line x1="0" y1="-11" x2="0" y2="11"/><line x1="-9.5" y1="-5.5" x2="9.5" y2="5.5"/><line x1="-9.5" y1="5.5" x2="9.5" y2="-5.5"/>
