<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#9a3412"/><stop offset="1" stop-color="#0f172a"/></linearGradient>
    <radialGradient id="heat" cx="0.5" cy="0.5" r="0.5"><stop offset="0" stop-color="#fde047"/><stop offset="0.45" stop-color="#fb923c" stop-opacity=".9"/><stop offset="1" stop-color="#ef4444" stop-opacity="0"/></radialGradient>
  </defs>
  <rect width="128" height="128" rx="28" fill="url(#bg)"/>
  <!-- corps vertébral (vue axiale) -->
  <ellipse cx="64" cy="58" rx="34" ry="28" fill="#e2e8f0"/>
  <ellipse cx="64" cy="58" rx="28" ry="22" fill="#cbd5e1"/>
