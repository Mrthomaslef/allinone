<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#F43F5E"/>
      <stop offset="45%" stop-color="#FB923C"/>
      <stop offset="100%" stop-color="#FACC15"/>
    </linearGradient>
    <filter id="sh" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="12" stdDeviation="10" flood-color="#000" flood-opacity="0.4"/>
    </filter>
  </defs>
  <rect width="512" height="512" rx="116" fill="url(#sky)"/>
  <!-- Big Tropical Sun -->
  <circle cx="256" cy="240" r="136" fill="#FEF08A" fill-opacity="0.85"/>
  <!-- Turquoise Ocean Waves -->
  <path d="M0 356 Q128 320 256 356 T512 356 V512 H0 Z" fill="#06B6D4"/>
  <path d="M0 412 Q128 380 256 412 T512 412 V512 H0 Z" fill="#0284C7"/>
  <!-- Palm Tree -->
  <g filter="url(#sh)">
    <path d="M184 390 Q210 270 176 172" stroke="#78350F" stroke-width="26" stroke-linecap="round" fill="none"/>
    <path d="M176 172 Q100 150 76 204 M176 172 Q120 100 184 82 M176 172 Q256 108 288 164 M176 172 Q248 176 266 232" stroke="#16A34A" stroke-width="24" stroke-linecap="round" fill="none"/>
  </g>
  <!-- Play / Video Badge -->
  <g filter="url(#sh)" transform="translate(276, 224) rotate(8)">
    <rect x="0" y="0" width="164" height="124" rx="32" fill="#1E1B4B" stroke="#FFFFFF" stroke-width="8"/>
    <polygon points="62,34 62,90 116,62" fill="#F43F5E"/>
  </g>
</svg>
