<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0284C7"/>
      <stop offset="50%" stop-color="#4F46E5"/>
      <stop offset="100%" stop-color="#7E22CE"/>
    </linearGradient>
    <filter id="sh" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="14" stdDeviation="12" flood-color="#090D16" flood-opacity="0.5"/>
    </filter>
  </defs>
  <rect width="512" height="512" rx="116" fill="url(#bg)"/>
  <!-- ID Badge Card -->
  <g filter="url(#sh)" transform="rotate(-6 240 260)">
    <rect x="92" y="118" width="276" height="310" rx="44" fill="#F8FAFC" stroke="#FFFFFF" stroke-width="8"/>
    <rect x="92" y="118" width="276" height="84" rx="40" fill="#38BDF8"/>
    <rect x="194" y="76" width="72" height="64" rx="20" fill="#FACC15" stroke="#FFFFFF" stroke-width="6"/>
    <!-- Avatar Circle -->
    <circle cx="230" cy="256" r="46" fill="#E0F2FE" stroke="#0284C7" stroke-width="6"/>
    <text x="230" y="274" text-anchor="middle" font-size="52">🩺</text>
    <!-- RADIO B Pill -->
    <rect x="134" y="328" width="192" height="56" rx="28" fill="#4F46E5"/>
    <text x="230" y="366" text-anchor="middle" fill="#FFFFFF" font-family="system-ui" font-weight="900" font-size="30">RADIO B</text>
  </g>
  <!-- Cute 3D Coffee Cup (Bottom Right) -->
  <g filter="url(#sh)" transform="translate(306, 260) rotate(10)">
    <path d="M20 40 H120 L108 156 C106 172 92 184 76 184 H64 C48 184 34 172 32 156 Z" fill="#F97316" stroke="#FFFFFF" stroke-width="8"/>
    <rect x="10" y="20" width="120" height="28" rx="14" fill="#FFFFFF"/>
    <path d="M24 84 H116 L112 128 H28 Z" fill="#FDE047"/>
  </g>
