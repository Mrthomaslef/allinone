<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#064E3B"/>
      <stop offset="50%" stop-color="#0F766E"/>
      <stop offset="100%" stop-color="#1E3A8A"/>
    </linearGradient>
    <linearGradient id="body" x1="110" y1="80" x2="402" y2="432" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#F8FAFC"/>
      <stop offset="100%" stop-color="#E2E8F0"/>
    </linearGradient>
    <filter id="sh" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="14" stdDeviation="12" flood-color="#022C22" flood-opacity="0.55"/>
    </filter>
  </defs>
  <rect width="512" height="512" rx="116" fill="url(#bg)"/>
  <!-- Tactile 3D Calculator Toy -->
  <g filter="url(#sh)">
    <rect x="106" y="76" width="300" height="360" rx="56" fill="url(#body)" stroke="#FFFFFF" stroke-width="8"/>
    <!-- ECG Screen -->
    <rect x="138" y="110" width="236" height="96" rx="26" fill="#0F172A" stroke="#38BDF8" stroke-width="4"/>
    <path d="M158 162 H198 L214 128 L234 188 L254 142 L270 162 H354" stroke="#10B981" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- Candy Keypad Buttons -->
    <rect x="138" y="230" width="66" height="66" rx="20" fill="#38BDF8"/>
    <text x="171" y="276" text-anchor="middle" fill="#FFF" font-family="system-ui" font-weight="900" font-size="38">+</text>
    <rect x="223" y="230" width="66" height="66" rx="20" fill="#A855F7"/>
    <text x="256" y="276" text-anchor="middle" fill="#FFF" font-family="system-ui" font-weight="900" font-size="38">−</text>
    <rect x="308" y="230" width="66" height="66" rx="20" fill="#F59E0B"/>
    <text x="341" y="276" text-anchor="middle" fill="#FFF" font-family="system-ui" font-weight="900" font-size="36">×</text>
    <rect x="138" y="314" width="151" height="66" rx="20" fill="#10B981"/>
    <text x="213" y="359" text-anchor="middle" fill="#FFF" font-family="system-ui" font-weight="900" font-size="34">SCORE</text>
    <rect x="308" y="314" width="66" height="66" rx="20" fill="#F43F5E"/>
    <text x="341" y="359" text-anchor="middle" fill="#FFF" font-family="system-ui" font-weight="900" font-size="34">♥</text>
  </g>
  <!-- Floating Red Medical Cross Badge -->
  <g filter="url(#sh)" transform="translate(330, 48) rotate(12)">
    <circle cx="64" cy="64" r="56" fill="#F43F5E" stroke="#FFFFFF" stroke-width="8"/>
    <path d="M64 34 V94 M34 64 H94" stroke="#FFFFFF" stroke-width="18" stroke-linecap="round"/>
  </g>
</svg>
