  <g filter="url(#sh)">
    <path d="M84 260 Q170 230 256 266 Q342 230 428 260 L428 402 Q342 372 256 408 Q170 372 84 402 Z" fill="url(#book)" stroke="#FFFFFF" stroke-width="8" stroke-linejoin="round"/>
    <path d="M98 242 Q176 212 256 248 Q336 212 414 242 L414 380 Q336 350 256 386 Q176 350 98 380 Z" fill="#FEFCE8"/>
    <line x1="256" y1="248" x2="256" y2="388" stroke="#CBD5E1" stroke-width="8" stroke-linecap="round"/>
  </g>
  <!-- Glowing 3D Bone Popping Out of Book -->
  <g filter="url(#sh)" transform="translate(256, 195) rotate(-28) translate(-256, -195)">
    <path d="M168 168 C144 148 120 172 140 196 C120 220 144 244 168 224 L344 224 C368 244 392 220 372 196 C392 172 368 148 344 168 Z" fill="#FFFFFF" stroke="#38BDF8" stroke-width="8" stroke-linejoin="round"/>
  </g>
  <!-- Sparkles -->
  <circle cx="136" cy="136" r="12" fill="#FDE047"/>
  <circle cx="388" cy="148" r="14" fill="#FDE047"/>
  <path d="M256 68 L266 94 L292 104 L266 114 L256 140 L246 114 L220 104 L246 94 Z" fill="#FDE047"/>
