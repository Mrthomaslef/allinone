<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#311042"/>
      <stop offset="50%" stop-color="#4C1D95"/>
      <stop offset="100%" stop-color="#1E3A8A"/>
    </linearGradient>
    <filter id="sh" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="14" stdDeviation="12" flood-color="#000" flood-opacity="0.55"/>
    </filter>
  </defs>
  <rect width="512" height="512" rx="116" fill="url(#bg)"/>
  <!-- Isometric 3D Parcel Box -->
  <g filter="url(#sh)">
    <!-- Top Face -->
    <polygon points="256,88 420,172 256,256 92,172" fill="#FDE047"/>
    <!-- Left Face -->
    <polygon points="92,172 256,256 256,428 92,344" fill="#F59E0B"/>
    <!-- Right Face -->
    <polygon points="256,256 420,172 420,344 256,428" fill="#D97706"/>
    <!-- Packing Tape -->
    <polygon points="174,130 338,214 338,274 306,290 306,230 142,146" fill="#38BDF8"/>
    <!-- Cute Eyes on Box -->
    <circle cx="154" cy="268" r="14" fill="#1E1B4B"/>
    <circle cx="212" cy="298" r="14" fill="#1E1B4B"/>
    <path d="M168 302 Q182 322 198 314" stroke="#1E1B4B" stroke-width="8" stroke-linecap="round" fill="none"/>
  </g>
  <!-- GPS Pin Badge -->
  <g filter="url(#sh)" transform="translate(310, 62) rotate(12)">
    <path d="M64 0 C28 0 0 28 0 64 C0 112 64 164 64 164 C64 164 128 112 128 64 C128 28 100 0 64 0 Z" fill="#F43F5E" stroke="#FFFFFF" stroke-width="8"/>
    <circle cx="64" cy="64" r="24" fill="#FFFFFF"/>
  </g>
</svg>
