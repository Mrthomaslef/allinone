<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#090D16"/>
      <stop offset="50%" stop-color="#1E1B4B"/>
      <stop offset="100%" stop-color="#0E7490"/>
    </linearGradient>
    <filter id="sh" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="14" stdDeviation="12" flood-color="#000" flood-opacity="0.6"/>
    </filter>
  </defs>
  <rect width="512" height="512" rx="116" fill="url(#bg)"/>
  <!-- 3D Monitor -->
  <g filter="url(#sh)">
    <rect x="76" y="88" width="360" height="272" rx="42" fill="#38BDF8" stroke="#FFFFFF" stroke-width="8"/>
    <rect x="98" y="110" width="316" height="228" rx="26" fill="#090D16"/>
    <!-- Glowing Hologram Ribcage / Scan -->
    <ellipse cx="256" cy="224" rx="88" ry="88" stroke="#22D3EE" stroke-width="8" stroke-dasharray="20 12"/>
    <line x1="256" y1="146" x2="256" y2="302" stroke="#F472B6" stroke-width="12" stroke-linecap="round"/>
    <path d="M206 184 Q256 204 306 184 M194 224 Q256 244 318 224 M210 264 Q256 284 302 264" stroke="#38BDF8" stroke-width="12" stroke-linecap="round" fill="none"/>
    <!-- Stand -->
    <path d="M216 360 H296 L316 420 H196 Z" fill="#94A3B8"/>
    <rect x="164" y="414" width="184" height="24" rx="12" fill="#F8FAFC"/>
  </g>
  <!-- PACS Badge -->
  <rect x="312" y="64" width="132" height="54" rx="27" fill="#EC4899" stroke="#FFFFFF" stroke-width="6" filter="url(#sh)"/>
  <text x="378" y="100" text-anchor="middle" fill="#FFFFFF" font-family="system-ui" font-weight="900" font-size="30">DICOM</text>
</svg>
